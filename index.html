<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTC Robot Configurator</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #111827; }
    .form-checkbox:checked { background-color: #10B981; border-color: #10B981; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

const FTCRobotConfigurator = () => {
  // Robot Dimensions
  const [robotLength, setRobotLength] = React.useState(18);
  const [robotWidth, setRobotWidth] = React.useState(18);

  // Drive Wheels
  const [wheelBrand, setWheelBrand] = React.useState('gobilda');
  const [wheelType, setWheelType] = React.useState('mecanum');
  const [wheelSize, setWheelSize] = React.useState(104);

  // Odometry Pod 1
  const [odo1Type, setOdo1Type] = React.useState('gobilda_4bar');
  const [odo1FromBack, setOdo1FromBack] = React.useState(9);
  const [odo1FromRight, setOdo1FromRight] = React.useState(9);
  const [odo1Reversed, setOdo1Reversed] = React.useState(false);
  const [odo1Measures, setOdo1Measures] = React.useState('forward_back');

  // Odometry Pod 2
  const [odo2Type, setOdo2Type] = React.useState('gobilda_4bar');
  const [odo2FromBack, setOdo2FromBack] = React.useState(9);
  const [odo2FromRight, setOdo2FromRight] = React.useState(9);
  const [odo2Reversed, setOdo2Reversed] = React.useState(false);
  const [odo2Measures, setOdo2Measures] = React.useState('left_right');

  // IMU Configuration
  const [imuLocation, setImuLocation] = React.useState('control_hub');
  const [imuLogoDirection, setImuLogoDirection] = React.useState('UP');
  const [imuUsbDirection, setImuUsbDirection] = React.useState('FORWARD');

  // Limelight Configuration
  const [limelightVersion, setLimelightVersion] = React.useState('3a');
  const [limelightFromBack, setLimelightFromBack] = React.useState(9);
  const [limelightFromRight, setLimelightFromRight] = React.useState(9);
  const [limelightHeight, setLimelightHeight] = React.useState(8);
  const [limelightFacing, setLimelightFacing] = React.useState('FORWARD');

  // Active Tab
  const [activeTab, setActiveTab] = React.useState('dimensions');

  // Code Output Mode
  const [codeOutputMode, setCodeOutputMode] = React.useState('teleop'); // 'snippet' or 'teleop'

  // Drive Motors Configuration
  const [motors, setMotors] = React.useState([
    { id: 1, name: 'frontLeft', type: 'gobilda_5203_26_9', hub: 'control', port: 1, reversed: true },
    { id: 2, name: 'frontRight', type: 'gobilda_5203_26_9', hub: 'control', port: 0, reversed: false },
    { id: 3, name: 'backLeft', type: 'gobilda_5203_26_9', hub: 'control', port: 3, reversed: true },
    { id: 4, name: 'backRight', type: 'gobilda_5203_26_9', hub: 'control', port: 2, reversed: false }
  ]);

  // Auxiliary Motors Configuration (arm, intake, etc.)
  const [auxMotors, setAuxMotors] = React.useState([]);

  // Servos Configuration
  const [servos, setServos] = React.useState([]);

  // Expansion Hub
  const [hasExpansionHub, setHasExpansionHub] = React.useState(false);

  // Odometry Encoder Ports
  const [odo1Port, setOdo1Port] = React.useState({ hub: 'control', port: 0 });
  const [odo2Port, setOdo2Port] = React.useState({ hub: 'control', port: 1 });

  // Robot Name (for save/load)
  const [robotName, setRobotName] = React.useState('My Robot');
  const [savedConfigs, setSavedConfigs] = React.useState([]);
  const [showSaveModal, setShowSaveModal] = React.useState(false);
  const [showLoadModal, setShowLoadModal] = React.useState(false);

  // Blinkin LED Configuration
  const [hasBlinkin, setHasBlinkin] = React.useState(false);
  const [blinkinPort, setBlinkinPort] = React.useState({ hub: 'control', port: 0 });
  const [blinkinPatterns, setBlinkinPatterns] = React.useState([
    { id: 1, name: 'default', pattern: 'solid_green', description: 'Default state' }
  ]);

  // Sensors Configuration
  const [sensors, setSensors] = React.useState([]);

  // AprilTag Configuration
  const [aprilTagSize, setAprilTagSize] = React.useState(165); // mm
  const [targetTags, setTargetTags] = React.useState([{ id: 1, tagId: 21, name: 'Scoring Station' }]);

  // Controller Configuration
  const [numControllers, setNumControllers] = React.useState(2);
  const [gamepad1Role, setGamepad1Role] = React.useState('driver');
  const [gamepad2Role, setGamepad2Role] = React.useState('operator');

  // Drive Controls
  const [driveForwardBack, setDriveForwardBack] = React.useState('left_stick_y');
  const [driveStrafe, setDriveStrafe] = React.useState('left_stick_x');
  const [driveRotate, setDriveRotate] = React.useState('right_stick_x');
  const [resetHeadingButton, setResetHeadingButton] = React.useState('options');
  const [slowModeButton, setSlowModeButton] = React.useState('none');
  const [slowModeSpeed, setSlowModeSpeed] = React.useState(0.4);

  // Motor Controls (map motor name to control config)
  const [motorControls, setMotorControls] = React.useState({});

  // Servo Controls (map servo name to control config)
  const [servoControls, setServoControls] = React.useState({});

  // Telemetry Configuration
  const [telemetryHeading, setTelemetryHeading] = React.useState(true);
  const [telemetryAprilTag, setTelemetryAprilTag] = React.useState(false);
  const [telemetryDriveMotors, setTelemetryDriveMotors] = React.useState(false);
  const [telemetryAuxMotors, setTelemetryAuxMotors] = React.useState(true);
  const [telemetryServos, setTelemetryServos] = React.useState(true);
  const [telemetryDistanceSensors, setTelemetryDistanceSensors] = React.useState(false);
  const [telemetryColorSensors, setTelemetryColorSensors] = React.useState(false);
  const [telemetryBattery, setTelemetryBattery] = React.useState(false);
  const [telemetryLoopTime, setTelemetryLoopTime] = React.useState(false);
  const [telemetryAlerts, setTelemetryAlerts] = React.useState(false);

  // Load saved configs on mount
  React.useEffect(() => {
    const saved = localStorage.getItem('ftc_robot_configs');
    if (saved) {
      setSavedConfigs(JSON.parse(saved));
    }
  }, []);

  // Wheel Database
  const wheelDatabase = {
    gobilda: {
      name: 'GoBilda',
      mecanum: [
        { size: 96, name: '96mm Mecanum', circumference: 96 * Math.PI },
        { size: 104, name: '104mm Mecanum', circumference: 104 * Math.PI }
      ],
      omni: [
        { size: 96, name: '96mm Omni', circumference: 96 * Math.PI },
        { size: 104, name: '104mm Omni', circumference: 104 * Math.PI }
      ],
      traction: [
        { size: 96, name: '96mm Traction', circumference: 96 * Math.PI },
        { size: 104, name: '104mm Traction', circumference: 104 * Math.PI }
      ]
    },
    rev: {
      name: 'REV Robotics',
      mecanum: [
        { size: 75, name: '75mm Mecanum', circumference: 75 * Math.PI }
      ],
      omni: [
        { size: 75, name: '75mm Omni', circumference: 75 * Math.PI },
        { size: 90, name: '90mm Omni', circumference: 90 * Math.PI }
      ],
      traction: [
        { size: 90, name: '90mm Traction', circumference: 90 * Math.PI }
      ]
    }
  };

  // Odometry Pod Database
  const odoDatabase = {
    gobilda_4bar: {
      name: 'GoBilda 4-Bar Pod',
      wheelDiameter: 32,
      cpr: 2000,
      ticksPerMm: 2000 / (32 * Math.PI),
      ticksPerInch: 2000 / (32 * Math.PI) * 25.4
    },
    gobilda_swingarm: {
      name: 'GoBilda Swingarm Pod',
      wheelDiameter: 48,
      cpr: 2000,
      ticksPerMm: 2000 / (48 * Math.PI),
      ticksPerInch: 2000 / (48 * Math.PI) * 25.4
    },
    rev_throughbore: {
      name: 'REV Through Bore + Dead Wheel',
      wheelDiameter: 35,
      cpr: 8192,
      ticksPerMm: 8192 / (35 * Math.PI),
      ticksPerInch: 8192 / (35 * Math.PI) * 25.4
    }
  };

  // Motor Database
  const motorDatabase = {
    // GoBilda Yellow Jacket 5203 Series
    gobilda_5203_5_2: { name: 'GoBilda 5203 - 5.2:1 (1150 RPM)', brand: 'GoBilda', rpm: 1150, ticksPerRev: 145.1, stallTorque: 0.35 },
    gobilda_5203_13_7: { name: 'GoBilda 5203 - 13.7:1 (435 RPM)', brand: 'GoBilda', rpm: 435, ticksPerRev: 384.5, stallTorque: 0.93 },
    gobilda_5203_19_2: { name: 'GoBilda 5203 - 19.2:1 (312 RPM)', brand: 'GoBilda', rpm: 312, ticksPerRev: 537.7, stallTorque: 1.30 },
    gobilda_5203_26_9: { name: 'GoBilda 5203 - 26.9:1 (223 RPM)', brand: 'GoBilda', rpm: 223, ticksPerRev: 751.8, stallTorque: 1.82 },
    gobilda_5203_50_9: { name: 'GoBilda 5203 - 50.9:1 (117 RPM)', brand: 'GoBilda', rpm: 117, ticksPerRev: 1425.1, stallTorque: 3.45 },
    gobilda_5203_71_2: { name: 'GoBilda 5203 - 71.2:1 (84 RPM)', brand: 'GoBilda', rpm: 84, ticksPerRev: 1993.6, stallTorque: 4.83 },
    gobilda_5203_139: { name: 'GoBilda 5203 - 139:1 (43 RPM)', brand: 'GoBilda', rpm: 43, ticksPerRev: 3895.9, stallTorque: 9.43 },
    gobilda_5203_188: { name: 'GoBilda 5203 - 188:1 (30 RPM)', brand: 'GoBilda', rpm: 30, ticksPerRev: 5281.1, stallTorque: 12.75 },
    // REV Motors
    rev_hd_hex_40: { name: 'REV HD Hex - 40:1 (150 RPM)', brand: 'REV', rpm: 150, ticksPerRev: 1120, stallTorque: 3.2 },
    rev_hd_hex_20: { name: 'REV HD Hex - 20:1 (300 RPM)', brand: 'REV', rpm: 300, ticksPerRev: 560, stallTorque: 1.6 },
    rev_core_hex: { name: 'REV Core Hex Motor (125 RPM)', brand: 'REV', rpm: 125, ticksPerRev: 288, stallTorque: 3.2 },
    rev_ultraplanetary_3: { name: 'REV UltraPlanetary 3:1', brand: 'REV', rpm: 1900, ticksPerRev: 84, stallTorque: 0.25 },
    rev_ultraplanetary_4: { name: 'REV UltraPlanetary 4:1', brand: 'REV', rpm: 1425, ticksPerRev: 112, stallTorque: 0.33 },
    rev_ultraplanetary_5: { name: 'REV UltraPlanetary 5:1', brand: 'REV', rpm: 1140, ticksPerRev: 140, stallTorque: 0.42 },
    rev_ultraplanetary_9: { name: 'REV UltraPlanetary 3:1 + 3:1 (9:1)', brand: 'REV', rpm: 633, ticksPerRev: 252, stallTorque: 0.75 },
    rev_ultraplanetary_12: { name: 'REV UltraPlanetary 3:1 + 4:1 (12:1)', brand: 'REV', rpm: 475, ticksPerRev: 336, stallTorque: 1.0 },
    rev_ultraplanetary_15: { name: 'REV UltraPlanetary 3:1 + 5:1 (15:1)', brand: 'REV', rpm: 380, ticksPerRev: 420, stallTorque: 1.25 },
    rev_ultraplanetary_16: { name: 'REV UltraPlanetary 4:1 + 4:1 (16:1)', brand: 'REV', rpm: 356, ticksPerRev: 448, stallTorque: 1.33 },
    rev_ultraplanetary_20: { name: 'REV UltraPlanetary 4:1 + 5:1 (20:1)', brand: 'REV', rpm: 285, ticksPerRev: 560, stallTorque: 1.67 },
    rev_ultraplanetary_25: { name: 'REV UltraPlanetary 5:1 + 5:1 (25:1)', brand: 'REV', rpm: 228, ticksPerRev: 700, stallTorque: 2.08 },
    // Spark Mini + NeveRest Motors (AndyMark)
    spark_neverest_20: { name: 'Spark Mini + NeveRest 20 (537 RPM)', brand: 'Spark Mini', rpm: 537, ticksPerRev: 537.6, stallTorque: 0.69 },
    spark_neverest_40: { name: 'Spark Mini + NeveRest 40 (269 RPM)', brand: 'Spark Mini', rpm: 269, ticksPerRev: 1120, stallTorque: 1.38 },
    spark_neverest_60: { name: 'Spark Mini + NeveRest 60 (179 RPM)', brand: 'Spark Mini', rpm: 179, ticksPerRev: 1680, stallTorque: 2.07 },
    spark_neverest_3_7: { name: 'Spark Mini + NeveRest 3.7 (1780 RPM)', brand: 'Spark Mini', rpm: 1780, ticksPerRev: 103.6, stallTorque: 0.17 },
    spark_neverest_orbital_20: { name: 'Spark Mini + NeveRest Orbital 20 (340 RPM)', brand: 'Spark Mini', rpm: 340, ticksPerRev: 537.6, stallTorque: 1.1 },
    // Spark Mini + Generic/Other Motors
    spark_hd_hex_40: { name: 'Spark Mini + HD Hex 40:1 (150 RPM)', brand: 'Spark Mini', rpm: 150, ticksPerRev: 1120, stallTorque: 3.2 },
    spark_hd_hex_20: { name: 'Spark Mini + HD Hex 20:1 (300 RPM)', brand: 'Spark Mini', rpm: 300, ticksPerRev: 560, stallTorque: 1.6 },
    spark_core_hex: { name: 'Spark Mini + Core Hex (125 RPM)', brand: 'Spark Mini', rpm: 125, ticksPerRev: 288, stallTorque: 3.2 },
    spark_generic_no_encoder: { name: 'Spark Mini + DC Motor (no encoder)', brand: 'Spark Mini', rpm: 0, ticksPerRev: 0, stallTorque: 0 }
  };

  // Servo Database
  const servoDatabase = {
    // GoBilda Servos
    gobilda_speed: { name: 'GoBilda Speed Servo (2000-0025)', brand: 'GoBilda', speed: 0.055, torque: 21.0, range: 300 },
    gobilda_torque: { name: 'GoBilda Torque Servo (2000-0025)', brand: 'GoBilda', speed: 0.11, torque: 42.0, range: 300 },
    gobilda_super_speed: { name: 'GoBilda Super Speed Servo', brand: 'GoBilda', speed: 0.035, torque: 14.0, range: 300 },
    // REV Servos
    rev_smart_servo: { name: 'REV Smart Robot Servo', brand: 'REV', speed: 0.14, torque: 13.5, range: 280 },
    rev_srs_continuous: { name: 'REV SRS Continuous Rotation', brand: 'REV', speed: 0.14, torque: 13.5, range: 360 },
    // Axon Servos
    axon_max: { name: 'Axon MAX+ Servo', brand: 'Axon', speed: 0.065, torque: 52.0, range: 355 },
    axon_mini: { name: 'Axon Mini Servo', brand: 'Axon', speed: 0.08, torque: 25.0, range: 355 }
  };

  // Blinkin LED Pattern Database
  // Formula: FTC_Value = (Pulse_Width_in_microseconds - 600) / 1800
  const blinkinDatabase = {
    // Solid Colors
    solid_red: { name: 'Solid Red', pulse: 1805, ftcValue: 0.669 },
    solid_orange: { name: 'Solid Orange', pulse: 1825, ftcValue: 0.681 },
    solid_yellow: { name: 'Solid Yellow', pulse: 1845, ftcValue: 0.692 },
    solid_green: { name: 'Solid Green', pulse: 1885, ftcValue: 0.714 },
    solid_blue: { name: 'Solid Blue', pulse: 1935, ftcValue: 0.742 },
    solid_violet: { name: 'Solid Violet', pulse: 1955, ftcValue: 0.753 },
    solid_white: { name: 'Solid White', pulse: 1975, ftcValue: 0.764 },
    solid_black: { name: 'Off / Black', pulse: 1995, ftcValue: 0.775 },
    // Rainbow patterns
    rainbow: { name: 'Rainbow', pulse: 1005, ftcValue: 0.225 },
    rainbow_party: { name: 'Rainbow Party', pulse: 1015, ftcValue: 0.231 },
    rainbow_ocean: { name: 'Rainbow Ocean', pulse: 1025, ftcValue: 0.236 },
    rainbow_lava: { name: 'Rainbow Lava', pulse: 1035, ftcValue: 0.242 },
    rainbow_forest: { name: 'Rainbow Forest', pulse: 1045, ftcValue: 0.247 },
    // Strobe patterns
    strobe_red: { name: 'Strobe Red', pulse: 1785, ftcValue: 0.658 },
    strobe_blue: { name: 'Strobe Blue', pulse: 1795, ftcValue: 0.664 },
    // Breath patterns
    breath_red: { name: 'Breath Red', pulse: 1545, ftcValue: 0.525 },
    breath_blue: { name: 'Breath Blue', pulse: 1555, ftcValue: 0.531 },
    // Heartbeat patterns
    heartbeat_red: { name: 'Heartbeat Red', pulse: 1565, ftcValue: 0.536 },
    heartbeat_blue: { name: 'Heartbeat Blue', pulse: 1575, ftcValue: 0.542 },
    // Two-color patterns
    sparkle_1on2: { name: 'Sparkle 1 on 2', pulse: 1685, ftcValue: 0.603 },
    sparkle_2on1: { name: 'Sparkle 2 on 1', pulse: 1695, ftcValue: 0.608 },
    bpm_rainbow: { name: 'BPM Rainbow', pulse: 1055, ftcValue: 0.253 },
    bpm_ocean: { name: 'BPM Ocean', pulse: 1075, ftcValue: 0.264 },
    fire_medium: { name: 'Fire Medium', pulse: 1215, ftcValue: 0.342 },
    fire_large: { name: 'Fire Large', pulse: 1225, ftcValue: 0.347 }
  };

  // Sensor Database
  const sensorDatabase = {
    // REV Sensors
    rev_color_v3: { name: 'REV Color Sensor V3', brand: 'REV', type: 'color', interface: 'i2c' },
    rev_2m_distance: { name: 'REV 2M Distance Sensor', brand: 'REV', type: 'distance', interface: 'i2c' },
    rev_touch: { name: 'REV Touch Sensor', brand: 'REV', type: 'touch', interface: 'digital' },
    rev_magnetic_limit: { name: 'REV Magnetic Limit Switch', brand: 'REV', type: 'limit', interface: 'digital' },
    rev_potentiometer: { name: 'REV Potentiometer', brand: 'REV', type: 'analog', interface: 'analog' },
    // GoBilda/Modern Robotics
    mr_color: { name: 'Modern Robotics Color Sensor', brand: 'MR', type: 'color', interface: 'i2c' },
    mr_gyro: { name: 'Modern Robotics Gyro', brand: 'MR', type: 'gyro', interface: 'i2c' },
    // Generic
    generic_limit: { name: 'Generic Limit Switch', brand: 'Generic', type: 'limit', interface: 'digital' },
    generic_encoder: { name: 'Generic Encoder', brand: 'Generic', type: 'encoder', interface: 'encoder' }
  };

  // Calculate offsets from center
  const calculateOffsets = () => {
    const centerX = robotWidth / 2;
    const centerY = robotLength / 2;

    // Odometry Pod 1 (Forward/Back)
    const odo1XOffset = odo1FromRight - centerX;
    const odo1YOffset = odo1FromBack - centerY;

    // Odometry Pod 2 (Left/Right)
    const odo2XOffset = odo2FromRight - centerX;
    const odo2YOffset = odo2FromBack - centerY;

    // Limelight
    const limelightXOffset = limelightFromRight - centerX;
    const limelightYOffset = limelightFromBack - centerY;

    return {
      odo1: { x: odo1XOffset, y: odo1YOffset },
      odo2: { x: odo2XOffset, y: odo2YOffset },
      limelight: { x: limelightXOffset, y: limelightYOffset }
    };
  };

  const offsets = calculateOffsets();
  const odo1Specs = odoDatabase[odo1Type];
  const odo2Specs = odoDatabase[odo2Type];

  // Validation function
  const getValidationWarnings = () => {
    const warnings = [];
    
    // Combine all motors for conflict checking
    const allMotors = [...motors, ...auxMotors];
    
    // Check for motor port conflicts (all motors)
    allMotors.forEach((m1, i) => {
      allMotors.forEach((m2, j) => {
        if (i < j && m1.hub === m2.hub && m1.port === m2.port) {
          warnings.push({ type: 'error', message: `Motor conflict: "${m1.name}" and "${m2.name}" both on ${m1.hub} hub port ${m1.port}` });
        }
      });
    });
    
    // Check for servo port conflicts
    servos.forEach((s1, i) => {
      servos.forEach((s2, j) => {
        if (i < j && s1.hub === s2.hub && s1.port === s2.port) {
          warnings.push({ type: 'error', message: `Servo conflict: "${s1.name}" and "${s2.name}" both on ${s1.hub} hub port ${s1.port}` });
        }
      });
    });

    // Check for Blinkin on same port as servo
    if (hasBlinkin) {
      const conflictingServo = servos.find(s => s.hub === blinkinPort.hub && s.port === blinkinPort.port);
      if (conflictingServo) {
        warnings.push({ type: 'error', message: `Blinkin conflicts with servo "${conflictingServo.name}" on ${blinkinPort.hub} hub port ${blinkinPort.port}` });
      }
    }
    
    // Check for missing drive motors
    const driveMotorNames = ['frontLeft', 'frontRight', 'backLeft', 'backRight'];
    const missingDrive = driveMotorNames.filter(name => !motors.find(m => m.name.toLowerCase() === name.toLowerCase()));
    if (missingDrive.length > 0 && motors.length > 0) {
      warnings.push({ type: 'warning', message: `Possible missing drive motors: ${missingDrive.join(', ')}` });
    }
    
    // Check if no drive motors configured
    if (motors.length === 0) {
      warnings.push({ type: 'warning', message: 'No drive motors configured' });
    }
    
    // Check odometry pod port conflicts
    if (odo1Port.hub === odo2Port.hub && odo1Port.port === odo2Port.port) {
      warnings.push({ type: 'error', message: `Odometry pods both on ${odo1Port.hub} hub port ${odo1Port.port}` });
    }
    
    // Check if robot dimensions are reasonable
    if (robotLength < 10 || robotLength > 24) {
      warnings.push({ type: 'warning', message: `Robot length ${robotLength}" seems unusual (typical: 12-18")` });
    }
    if (robotWidth < 10 || robotWidth > 24) {
      warnings.push({ type: 'warning', message: `Robot width ${robotWidth}" seems unusual (typical: 12-18")` });
    }
    
    // Check sensor port conflicts
    sensors.forEach((s1, i) => {
      sensors.forEach((s2, j) => {
        if (i < j && s1.hub === s2.hub && s1.interface === s2.interface && s1.port === s2.port) {
          warnings.push({ type: 'error', message: `Sensor conflict: "${s1.name}" and "${s2.name}" both on ${s1.hub} hub ${s1.interface} port ${s1.port}` });
        }
      });
    });
    
    return warnings;
  };

  const validationWarnings = getValidationWarnings();

  // Save configuration
  const saveConfig = () => {
    const config = {
      name: robotName,
      savedAt: new Date().toISOString(),
      robotLength, robotWidth,
      wheelBrand, wheelType, wheelSize,
      odo1Type, odo1FromBack, odo1FromRight, odo1Reversed, odo1Measures, odo1Port,
      odo2Type, odo2FromBack, odo2FromRight, odo2Reversed, odo2Measures, odo2Port,
      imuLocation, imuLogoDirection, imuUsbDirection,
      limelightVersion, limelightFromBack, limelightFromRight, limelightHeight, limelightFacing,
      motors, auxMotors, servos, hasExpansionHub,
      hasBlinkin, blinkinPort, blinkinPatterns,
      sensors, aprilTagSize, targetTags,
      numControllers, gamepad1Role, gamepad2Role,
      driveForwardBack, driveStrafe, driveRotate, resetHeadingButton,
      slowModeButton, slowModeSpeed, motorControls, servoControls,
      telemetryHeading, telemetryAprilTag, telemetryDriveMotors, telemetryAuxMotors,
      telemetryServos, telemetryDistanceSensors, telemetryColorSensors,
      telemetryBattery, telemetryLoopTime, telemetryAlerts
    };
    
    const existingIndex = savedConfigs.findIndex(c => c.name === robotName);
    let newConfigs;
    if (existingIndex >= 0) {
      newConfigs = [...savedConfigs];
      newConfigs[existingIndex] = config;
    } else {
      newConfigs = [...savedConfigs, config];
    }
    
    setSavedConfigs(newConfigs);
    localStorage.setItem('ftc_robot_configs', JSON.stringify(newConfigs));
    setShowSaveModal(false);
  };

  // Load configuration
  const loadConfig = (config) => {
    setRobotName(config.name || 'My Robot');
    setRobotLength(config.robotLength || 18);
    setRobotWidth(config.robotWidth || 18);
    setWheelBrand(config.wheelBrand || 'gobilda');
    setWheelType(config.wheelType || 'mecanum');
    setWheelSize(config.wheelSize || 104);
    setOdo1Type(config.odo1Type || 'gobilda_4bar');
    setOdo1FromBack(config.odo1FromBack || 9);
    setOdo1FromRight(config.odo1FromRight || 9);

${targetTags.map(t => `private static final int TAG_${t.name.toUpperCase().replace(/\s+/g, '_')} = ${t.tagId};  // ${t.name}`).join('\n')}

        'a': `${gamepad}.a`,

        'y': `${gamepad}.y`,
        'left_bumper': `${gamepad}.left_bumper`,

        ${motor.name}.setPower(${motor.name}Running ? ${power} : 0);`;

        ${motor.name}.setPower((${gp}.right_trigger - ${gp}.left_trigger) * ${power});`;

        else ${motor.name}.setPower(0);`;

        else if (${gp}.dpad_down) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;
          case 'dpad_leftright':
            code = `        // ${motor.name} - D-Pad Left/Right control
        if (${gp}.dpad_right) ${motor.name}.setPower(${power});
        else if (${gp}.dpad_left) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;

            code = `        // ${motor.name} - Left Stick Y control
        ${motor.name}.setPower(-${gp}.left_stick_y * ${power});`;
            break;
          case 'right_stick_y':
            code = `        // ${motor.name} - Right Stick Y control
        ${motor.name}.setPower(-${gp}.right_stick_y * ${power});`;
            break;

            code = `        // ${motor.name} - A/B button control
        if (${gp}.a) ${motor.name}.setPower(${power});
        else if (${gp}.b) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;

            code = `        // ${motor.name} - X/Y button control
        if (${gp}.y) ${motor.name}.setPower(${power});
        else if (${gp}.x) ${motor.name}.setPower(-${power});

${motors.map(m => `    private DcMotor ${m.name};`).join('\n')}

${auxMotors.length > 0 ? `    // Auxiliary Motors
${auxMotors.map(m => `    private DcMotor ${m.name};`).join('\n')}` : ''}

${servos.length > 0 ? `    // Servos
${servos.map(s => `    private Servo ${s.name};`).join('\n')}` : ''}

    private IMU imu;

${hasBlinkin ? `    // Blinkin LED

${toggleMotors.length > 0 ? `    // Motor toggle states

    @Override
    public void runOpMode() {

${motors.map(m => `        ${m.name} = hardwareMap.get(DcMotor.class, "${m.name}");
        ${m.name}.setDirection(DcMotorSimple.Direction.${m.reversed ? 'REVERSE' : 'FORWARD'});`).join('\n')}

${auxMotors.length > 0 ? `        // Initialize auxiliary motors
${auxMotors.map(m => `        ${m.name} = hardwareMap.get(DcMotor.class, "${m.name}");

        imu = hardwareMap.get(IMU.class, "imu");

        imu.initialize(new IMU.Parameters(new RevHubOrientationOnRobot(logoDirection, usbDirection)));

${hasBlinkin ? `        // Initialize Blinkin
        blinkin = hardwareMap.get(Servo.class, "blinkin");
        blinkin.setPosition(BLINKIN_${(blinkinPatterns[0]?.name || 'DEFAULT').toUpperCase().replace(/\s+/g, '_')});` : ''}

${slowModeButton !== 'none' ? `            // Slow mode

            double rotatedForward = forward * Math.cos(heading) + strafe * Math.sin(heading);

            double frontLeftPower = rotatedForward + rotatedStrafe + rotate;
            double frontRightPower = rotatedForward - rotatedStrafe - rotate;
            double backLeftPower = rotatedForward - rotatedStrafe + rotate;

            double maxPower = Math.max(Math.max(Math.abs(frontLeftPower), Math.abs(frontRightPower)),

            </button>
            <button
              onClick={() => setShowLoadModal(true)}
              className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium"
            >
              📂 Load
            </button>
            <button
              onClick={exportConfig}
              className="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm font-medium"
            >
              ⬇️ Export
            </button>
            <label className="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm font-medium cursor-pointer">
              ⬆️ Import
              <input type="file" accept=".json" onChange={importConfig} className="hidden" />
            </label>
          </div>
        </div>

        {/* Validation Warnings */}
        {validationWarnings.length > 0 && (
          <div className="mt-4 bg-gray-800 border border-yellow-600 rounded-lg p-3">
            <h4 className="text-yellow-400 font-semibold mb-2">⚠️ Configuration Issues ({validationWarnings.length})</h4>
            <div className="space-y-1 max-h-24 overflow-y-auto">
              {validationWarnings.map((w, i) => (
                <div key={i} className={`text-sm ${w.type === 'error' ? 'text-red-400' : 'text-yellow-300'}`}>
                  {w.type === 'error' ? '❌' : '⚠️'} {w.message}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Save Modal */}
      {showSaveModal && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
          <div className="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
            <h3 className="text-xl font-bold text-green-400 mb-4">Save Configuration</h3>
            <div className="mb-4">
              <label className="block text-sm text-gray-300 mb-1">Robot Name</label>
              <input
                type="text"
                value={robotName}
                onChange={(e) => setRobotName(e.target.value)}
                className="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white"
              />
            </div>
            {savedConfigs.find(c => c.name === robotName) && (
              <p className="text-yellow-400 text-sm mb-4">⚠️ This will overwrite the existing "{robotName}" configuration</p>
            )}
            <div className="flex gap-2 justify-end">
              <button
                onClick={() => setShowSaveModal(false)}
                className="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded text-sm"
              >
                Cancel
              </button>
              <button
                onClick={saveConfig}
                className="px-4 py-2 bg-green-600 hover:bg-green-700 rounded text-sm"
              >
                Save
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Load Modal */}
      {showLoadModal && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
          <div className="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
            <h3 className="text-xl font-bold text-blue-400 mb-4">Load Configuration</h3>
            {savedConfigs.length === 0 ? (
              <p className="text-gray-400">No saved configurations found.</p>
            ) : (
              <div className="space-y-2 max-h-64 overflow-y-auto mb-4">
                {savedConfigs.map((config, i) => (
                  <div key={i} className="flex items-center justify-between bg-gray-700 rounded p-3">
                    <div>
                      <div className="text-white font-medium">{config.name}</div>
                      <div className="text-gray-400 text-xs">
                        {new Date(config.savedAt).toLocaleDateString()}
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => loadConfig(config)}
                        className="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-sm"
                      >
                        Load
                      </button>
                      <button
                        onClick={() => deleteConfig(config.name)}
                        className="px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm"
                      >
                        🗑️
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="flex justify-end">
              <button
                onClick={() => setShowLoadModal(false)}
                className="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded text-sm"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">
        {/* Left Column - Configuration */}
        <div>
          {/* Tabs */}
          <div className="flex flex-wrap gap-1 mb-4 bg-gray-800 p-1 rounded-lg">
            {[
              { id: 'dimensions', label: 'Robot' },
              { id: 'wheels', label: 'Wheels' },
              { id: 'drive', label: 'Drive' },
              { id: 'motors', label: 'Motors' },
              { id: 'servos', label: 'Servos' },
              { id: 'sensors', label: 'Sensors' },
              { id: 'odometry', label: 'Odometry' },
              { id: 'imu', label: 'IMU' },
              { id: 'limelight', label: 'Limelight' },
              { id: 'apriltags', label: 'Tags' },
              { id: 'blinkin', label: 'LEDs' },
              { id: 'ports', label: 'Ports' },
              { id: 'controls', label: 'Controls' },
              { id: 'telemetry', label: 'Telemetry' },
              { id: 'output', label: 'Code' },
              { id: 'driverstation', label: 'DS' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-2 py-1 rounded-md text-xs font-medium transition-colors ${
                  activeTab === tab.id
                    ? 'bg-green-600 text-white'
                    : 'text-gray-400 hover:text-white hover:bg-gray-700'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Tab Content */}
          <div className="bg-gray-800 p-6 rounded-lg">
            {renderTabContent()}
          </div>
        </div>

        {/* Right Column - Visual */}
        <div>
          <RobotDiagram />
        </div>
      </div>

      {/* Footer */}
      <div className="text-center mt-6 text-gray-500 text-sm">
        <p>FTC Robot Configurator v3.0 | Save/Load • Validation • Print</p>
      </div>
    </div>
  );
};


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FTCRobotConfigurator />);
  </script>
</body>
</html>
