      case 'macros':
        const triggerButtonOptions = [
          { value: 'a', label: 'A' },
          { value: 'b', label: 'B' },
          { value: 'x', label: 'X' },
          { value: 'y', label: 'Y' },
          { value: 'left_bumper', label: 'LB' },
          { value: 'right_bumper', label: 'RB' },
          { value: 'dpad_up', label: 'D-Pad Up' },
          { value: 'dpad_down', label: 'D-Pad Down' },
          { value: 'dpad_left', label: 'D-Pad Left' },
          { value: 'dpad_right', label: 'D-Pad Right' },
          // Analog, so "pressed" is a threshold. Fixed at 0.5 rather than
          // exposed — one less number to get wrong.
          { value: 'left_trigger', label: 'Left Trigger' },
          { value: 'right_trigger', label: 'Right Trigger' }
        ];

        const actionTypes = [
          // Driving
          { value: 'drive_distance', label: '🚗 Drive Distance', icon: '🚗', category: 'drive' },
          { value: 'turn_to_heading', label: '🔄 Turn to Heading', icon: '🔄', category: 'drive' },
          { value: 'drive_time', label: '⏱️ Drive for Time', icon: '⏱️', category: 'drive' },
          { value: 'drive_to_tag', label: '🎯 Drive to AprilTag', icon: '🎯', category: 'drive' },
          // Motors
          { value: 'motor_position', label: '⚙️ Motor to Position', icon: '⚙️', category: 'motor' },
          { value: 'motor_time', label: '🔄 Run Motor for Time', icon: '🔄', category: 'motor' },
          // Latching. Sets power and returns, so the macro finishes while the
          // motor keeps running — the robot can drive with the intake on.
          { value: 'motor_on', label: '▶️ Turn Motor On (stays on)', icon: '▶️', category: 'motor' },
          { value: 'motor_off', label: '⏹️ Turn Motor Off', icon: '⏹️', category: 'motor' },
          { value: 'motor_until_velocity', label: '🏎️ Motor Until Velocity', icon: '🏎️', category: 'motor' },
          { value: 'wait_velocity', label: '⏸️ Wait for Velocity', icon: '⏸️', category: 'motor' },
          // Other
          { value: 'servo_position', label: '🦾 Set Servo Position', icon: '🦾', category: 'other' },
          { value: 'wait', label: '⏱️ Wait', icon: '⏱️', category: 'other' },
          { value: 'led_pattern', label: '💡 Set LED Pattern', icon: '💡', category: 'other' }
        ];

        // A macro that drives fights the autonomous path and corrupts odometry,
        // so only mechanism-only macros may be exposed to PathPilot.
        const DRIVE_STEPS = actionTypes.filter(a => a.category === 'drive').map(a => a.value);
        const macroDriveSteps = (macro) =>
          (macro.steps || []).filter(st => DRIVE_STEPS.includes(st.type));
        const macroIsMechanismOnly = (macro) => macroDriveSteps(macro).length === 0;

        const driveDirections = [
          { value: 'forward', label: 'Forward' },
          { value: 'backward', label: 'Backward' },
          { value: 'left', label: 'Strafe Left' },
          { value: 'right', label: 'Strafe Right' }
        ];

        const createNewMacro = () => {
          const newId = macros.length > 0 ? Math.max(...macros.map(m => m.id)) + 1 : 1;
          const newMacro = {
            id: newId,
            name: `Macro ${newId}`,
            triggerType: 'button',
            triggerButton: 'a',
            triggerCombo: null,
            triggerController: 'gamepad2',
            behavior: 'press', // 'press' or 'hold'
            pathpilotEnabled: false, // expose as a PathPilot waypoint action
            steps: []
          };
          setMacros([...macros, newMacro]);
          setEditingMacroId(newId);
        };

        const updateMacro = (macroId, field, value) => {
          setMacros(macros.map(m => m.id === macroId ? { ...m, [field]: value } : m));
        };

        const deleteMacro = (macroId) => {
          setMacros(macros.filter(m => m.id !== macroId));
          if (editingMacroId === macroId) setEditingMacroId(null);
        };

        const addStep = (macroId) => {
          const macro = macros.find(m => m.id === macroId);
          if (!macro) return;
          const newStepId = macro.steps.length > 0 ? Math.max(...macro.steps.map(s => s.id)) + 1 : 1;
          const newStep = {
            id: newStepId,
            type: 'wait',
            // Common fields
            duration: 0.5,
            // Drive fields
            driveDirection: 'forward',
            driveDistance: 12,
            drivePower: 0.5,
            targetHeading: 0,
            // Drive to tag fields
            tagId: 21,
            distance: 24,
            offset: 0,
            tolerance: defaultTolerance,
            // Motor fields
            motorName: auxMotors.length > 0 ? auxMotors[0].name : '',
            motorPosition: 0,
            motorPower: 0.8,
            motorDuration: 1.0,
            // Velocity fields
            targetVelocity: 1000,
            velocityCondition: 'above', // 'above' or 'below'
            velocityTimeout: 3.0,
            // Servo fields
            servoName: servos.length > 0 ? servos[0].name : '',
            servoPosition: 0.5,
            // LED fields
            ledPattern: blinkinPatterns.length > 0 ? blinkinPatterns[0].name : 'default'
          };
          updateMacro(macroId, 'steps', [...macro.steps, newStep]);
        };

        const updateStep = (macroId, stepId, field, value) => {
          const macro = macros.find(m => m.id === macroId);
          if (!macro) return;
          const updatedSteps = macro.steps.map(s => s.id === stepId ? { ...s, [field]: value } : s);
          updateMacro(macroId, 'steps', updatedSteps);
        };

        const deleteStep = (macroId, stepId) => {
          const macro = macros.find(m => m.id === macroId);
          if (!macro) return;
          updateMacro(macroId, 'steps', macro.steps.filter(s => s.id !== stepId));
        };

        const moveStep = (macroId, stepId, direction) => {
          const macro = macros.find(m => m.id === macroId);
          if (!macro) return;
          const idx = macro.steps.findIndex(s => s.id === stepId);
          if (idx === -1) return;
          if (direction === 'up' && idx > 0) {
            const newSteps = [...macro.steps];
            [newSteps[idx - 1], newSteps[idx]] = [newSteps[idx], newSteps[idx - 1]];
            updateMacro(macroId, 'steps', newSteps);
          } else if (direction === 'down' && idx < macro.steps.length - 1) {
            const newSteps = [...macro.steps];
            [newSteps[idx], newSteps[idx + 1]] = [newSteps[idx + 1], newSteps[idx]];
            updateMacro(macroId, 'steps', newSteps);
          }
        };

        const editingMacro = macros.find(m => m.id === editingMacroId);

        const renderStepConfig = (macro, step) => {
          switch (step.type) {
            case 'drive_distance':
              return (
                <div className="grid grid-cols-3 gap-2 mt-2">
                  <div>
                    <label className="block text-xs text-gray-400">Direction</label>
                    <select
                      value={step.driveDirection}
                      onChange={(e) => updateStep(macro.id, step.id, 'driveDirection', e.target.value)}
                      className="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white text-sm"
                    >
                      {driveDirections.map(d => <option key={d.value} value={d.value}>{d.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-400">Distance (in)</label>
                    <input
                      type="number"

                  strokeLinecap="round"

                  x1={odo2X}
                  y1={odo2Y - 12}
                  x2={odo2X}
                  y2={odo2Y + 12}

                  strokeLinecap="round"

              { id: 'odometry', label: 'Odometry' },
              { id: 'imu', label: 'IMU' },
              { id: 'limelight', label: 'Limelight' },
              { id: 'apriltags', label: 'Tags' },
              { id: 'blinkin', label: 'LEDs' },
              { id: 'ports', label: 'Ports' },
              { id: 'controls', label: 'Controls' },
              { id: 'macros', label: 'Macros' },
              { id: 'telemetry', label: 'Telemetry' },
              { id: 'output', label: 'Code' },
              { id: 'driverstation', label: 'DS' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-2 py-1 rounded-md text-xs font-medium transition-colors ${
                  activeTab === tab.id
                    ? 'bg-green-600 text-white'
                    : 'text-gray-400 hover:text-white hover:bg-gray-700'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Tab Content */}
          <div className="bg-gray-800 p-6 rounded-lg">
            {renderTabContent()}
          </div>
        </div>

        {/* Right Column - Visual */}
        <div>
          <RobotDiagram />
        </div>
      </div>

      {/* Footer */}
      <div className="text-center mt-6 text-gray-500 text-sm">
        <p>BotBuilder v5.0 &nbsp;|&nbsp; Build · Configure · Program</p>
      </div>
    </div>
  );
};


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FTCRobotConfigurator />);
  </script>
</body>
</html>
