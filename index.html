  <script type="text/babel">
// Java identifiers cannot contain spaces or punctuation and cannot start with a
// digit. Robot and macro names are free text, so everything that becomes an
// identifier goes through here first. The hardware NAME strings sent to
// hardwareMap are left untouched — those must match the Driver Station config
// exactly, spaces and all.
const JAVA_RESERVED = new Set(['abstract','assert','boolean','break','byte','case','catch','char',
  'class','const','continue','default','do','double','else','enum','extends','final','finally',
  'float','for','goto','if','implements','import','instanceof','int','interface','long','native',
  'new','package','private','protected','public','return','short','static','strictfp','super',
  'switch','synchronized','this','throw','throws','transient','try','void','volatile','while',
  'true','false','null','var','record','yield']);

const javaClassName = (name, suffix) => {
  let base = String(name || '').replace(/[^A-Za-z0-9]+/g, ' ').trim();
  base = base ? base.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('') : '';
  if (!base) base = 'Robot';
  if (/^[0-9]/.test(base)) base = 'Robot' + base;
  return base + (suffix || '');
};

// For a motor or servo used as a Java variable. Keeps the name recognisable
// while guaranteeing it compiles.
const javaVarName = (name) => {
  let base = String(name || '').replace(/[^A-Za-z0-9]+/g, ' ').trim();
  if (!base) return 'device';
  const parts = base.split(/\s+/);
  let out = parts.map((w, i) => i === 0
    ? w.charAt(0).toLowerCase() + w.slice(1)
    : w.charAt(0).toUpperCase() + w.slice(1)).join('');
  if (/^[0-9]/.test(out)) out = 'm' + out.charAt(0).toUpperCase() + out.slice(1);
  if (JAVA_RESERVED.has(out)) out = out + 'Motor';
  return out;
};

// "Score High" -> scoreHigh. PathPilot emits direct calls rather than string
// dispatch, so renaming a macro breaks the build loudly instead of silently
// no-opping at a competition.
const javaMethodName = (name) => {
  const parts = String(name || '').replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/);
  if (!parts.length || !parts[0]) return 'macro';
  let out = parts.map((w, i) => i === 0
    ? w.charAt(0).toLowerCase() + w.slice(1)
    : w.charAt(0).toUpperCase() + w.slice(1)).join('');
  if (/^[0-9]/.test(out)) out = 'macro' + out.charAt(0).toUpperCase() + out.slice(1);
  if (JAVA_RESERVED.has(out)) out = out + 'Macro';
  return out;
};

const FTCRobotConfigurator = () => {
  // Robot Dimensions
  const [robotLength, setRobotLength] = React.useState(18);
  const [robotWidth, setRobotWidth] = React.useState(18);

  // Drive Wheels
  const [wheelBrand, setWheelBrand] = React.useState('gobilda');
  const [wheelType, setWheelType] = React.useState('mecanum');
  const [wheelSize, setWheelSize] = React.useState(104);

  // Subsystem presence. Without these, generated code initializes hardware that
  // isn't on the robot and throws at init rather than failing gracefully.
  const [hasOdometry, setHasOdometry] = React.useState(true);
  const [hasLimelight, setHasLimelight] = React.useState(true);

  // Odometry Pod 1
  const [odo1Type, setOdo1Type] = React.useState('gobilda_4bar');
  const [odo1FromBack, setOdo1FromBack] = React.useState(9);
  const [odo1FromRight, setOdo1FromRight] = React.useState(9);
  const [odo1Reversed, setOdo1Reversed] = React.useState(false);
  const [odo1Measures, setOdo1Measures] = React.useState('forward_back');

  // Odometry Pod 2
  const [odo2Type, setOdo2Type] = React.useState('gobilda_4bar');
  const [odo2FromBack, setOdo2FromBack] = React.useState(9);
  const [odo2FromRight, setOdo2FromRight] = React.useState(9);
  const [odo2Reversed, setOdo2Reversed] = React.useState(false);
  const [odo2Measures, setOdo2Measures] = React.useState('left_right');

  // Measured calibration results (from the generated OdometryCalibration OpMode).
  // Empty string means "not measured" — distinct from a measured value of 0.
  const [calParallelTPI, setCalParallelTPI] = React.useState('');
  const [calPerpTPI, setCalPerpTPI] = React.useState('');
  const [calParallelXOffset, setCalParallelXOffset] = React.useState('');
  const [calPerpYOffset, setCalPerpYOffset] = React.useState('');
  const [calDate, setCalDate] = React.useState('');

  // IMU Configuration
  const [imuLocation, setImuLocation] = React.useState('control_hub');
  const [imuLogoDirection, setImuLogoDirection] = React.useState('UP');

    const byName = {};
    (motors || []).forEach(m => { byName[m.name.toLowerCase()] = javaVarName(m.name); });
    const four = ['frontleft', 'frontright', 'backleft', 'backright'];
    if (four.every(n => byName[n])) {
      return { kind: 'mecanum', fl: byName.frontleft, fr: byName.frontright, bl: byName.backleft, br: byName.backright };
    }
    const left = (motors || []).filter(m => /left/i.test(m.name));
    const right = (motors || []).filter(m => /right/i.test(m.name));
    if (left.length && right.length && left.length + right.length === (motors || []).length) {
      return { kind: 'tank', left: left.map(m => javaVarName(m.name)), right: right.map(m => javaVarName(m.name)) };
    }
    return { kind: 'unknown' };
  };

  // Validation function
  /** Lowest motor port on a hub with nothing on it, so a new motor does not
   *  silently land on top of an existing one. */
  const nextFreePort = (hub) => {
    const taken = new Set((motors || []).concat(auxMotors || [])
      .filter(m => (m.hub || 'control') === hub).map(m => Number(m.port)));
    for (let p = 0; p <= 3; p++) if (!taken.has(p)) return p;
    return 0;
  };

  const driverPad = () => (gamepad1Role === 'driver' ? 'gamepad1' : 'gamepad2');

  const getValidationWarnings = () => {
    const warnings = [];
    
    // Combine all motors for conflict checking
    const allMotors = [...motors, ...auxMotors];
    
    // Check for motor port conflicts (all motors)
    allMotors.forEach((m1, i) => {
      allMotors.forEach((m2, j) => {
        if (i < j && m1.hub === m2.hub && m1.port === m2.port) {
          warnings.push({ type: 'error', message: `Motor conflict: "${m1.name}" and "${m2.name}" both on ${m1.hub} hub port ${m1.port}` });
        }
      });
    });
    
    // Check for servo port conflicts
    servos.forEach((s1, i) => {
      servos.forEach((s2, j) => {
        if (i < j && s1.hub === s2.hub && s1.port === s2.port) {
          warnings.push({ type: 'error', message: `Servo conflict: "${s1.name}" and "${s2.name}" both on ${s1.hub} hub port ${s1.port}` });
        }
      });
    });

    // Check for Blinkin on same port as servo
    if (hasBlinkin) {
      const conflictingServo = servos.find(s => s.hub === blinkinPort.hub && s.port === blinkinPort.port);
      if (conflictingServo) {
        warnings.push({ type: 'error', message: `Blinkin conflicts with servo "${conflictingServo.name}" on ${blinkinPort.hub} hub port ${blinkinPort.port}` });
      }
    }
    
    // Check for missing drive motors
    const driveMotorNames = ['frontLeft', 'frontRight', 'backLeft', 'backRight'];
    const missingDrive = driveMotorNames.filter(name => !motors.find(m => m.name.toLowerCase() === name.toLowerCase()));
    if (missingDrive.length > 0 && motors.length > 0) {
      warnings.push({ type: 'warning', message: `Possible missing drive motors: ${missingDrive.join(', ')}` });
    }
    
    // Check if no drive motors configured
    if (motors.length === 0 && (auxMotors || []).length === 0) {
      warnings.push({ type: 'warning', message: 'No motors configured yet' });
    }
    
    // Macro steps pointing at hardware that no longer exists
    (macros || []).forEach(m => {
      (m.steps || []).forEach((st, i) => {
        const problem = stepProblem(st);
        if (problem) warnings.push({ type: 'error', message: `Macro "${m.name}" step ${i + 1}: ${problem}` });
      });
    });

    // Drivetrain the motors actually describe
    (() => {
      const dl = driveLayout();
      if (dl.kind === 'unknown' && (motors || []).length > 0) {
        warnings.push({ type: 'error', message: 'Motor names do not describe a drivetrain. Mecanum needs frontLeft/frontRight/backLeft/backRight; tank needs names containing "left" and "right".' });
      }
      if (dl.kind === 'tank') {
        warnings.push({ type: 'warning', message: `Tank drive detected (${dl.left.length} left, ${dl.right.length} right). Strafe and field-oriented driving are disabled — a differential drivetrain cannot move sideways.` });
      }
    })();

    // A control bound to gamepad2 on a one-controller robot never responds.
    if (numControllers === 1) {
      const stray = [];
      Object.keys(motorControls || {}).forEach(n => {
        if (motorControls[n] && motorControls[n].controller === 'gamepad2') stray.push(`motor "${n}"`);
      });
      Object.keys(servoControls || {}).forEach(n => {
        if (servoControls[n] && servoControls[n].controller === 'gamepad2') stray.push(`servo "${n}"`);
      });
      (macros || []).forEach(m => {
        if (m.triggerController === 'gamepad2') stray.push(`macro "${m.name}"`);
      });
      stray.forEach(what => warnings.push({ type: 'error',
        message: `${what} is bound to gamepad 2, but this robot is configured for one controller. It will never respond. Change it to gamepad 1, or set two controllers in the Controls tab.` }));
    }

    // A latching motor that also has a direct control will be stomped every loop.
    (macros || []).forEach(m => {
      (m.steps || []).forEach(st => {
        if (st.type !== 'motor_on' || !st.motorName) return;
        const c = motorControls[st.motorName];
        if (c && c.control && c.control !== 'none') {
          warnings.push({ type: 'error',
            message: `Macro "${m.name}" latches "${st.motorName}" on, but that motor also has a direct control in the Controls tab. The control writes to it every loop and will immediately turn it back off. Set its control to "Not directly controlled".` });
        }
      });
    });

    // A device left on the expansion hub after it is switched off is invisible
    // in the Ports tab and will not resolve on the robot.
    if (!hasExpansionHub) {
      const orphans = (motors || []).concat(auxMotors || []).concat(servos || [])
        .filter(d => d.hub === 'expansion');
      orphans.forEach(d => warnings.push({ type: 'error',
        message: `"${d.name}" is assigned to the expansion hub, but this robot has no expansion hub. Move it to the control hub or enable the expansion hub in the Drive tab.` }));
    }

    // Drive motors are optional. A bench setup with one motor is a real thing.
    if ((motors || []).length === 0 && (auxMotors || []).length > 0) {
      warnings.push({ type: 'warning',
        message: 'No drive motors configured. The generated TeleOp will control mechanisms only, with no drivetrain — fine for bench testing.' });
    }

    // Buttons assigned to more than one thing. The generated code reads them in
    // every place they appear, so one press fires all of them.
    (() => {
      const claims = [];
      const label = (v) => v;
      if (resetHeadingButton && resetHeadingButton !== 'none') claims.push([resetHeadingButton, 'reset heading', driverPad()]);
      if (slowModeButton && slowModeButton !== 'none') claims.push([slowModeButton, 'slow mode', driverPad()]);
      if (robotOrientedButton && robotOrientedButton !== 'none') claims.push([robotOrientedButton, 'robot-oriented toggle', driverPad()]);
      (macros || []).forEach(m => {
        if (m.triggerType === 'button' || m.triggerType === 'combo')
          claims.push([m.triggerButton, `macro "${m.name}"`, m.triggerController]);
      });
      Object.keys(servoControls || {}).forEach(name => {
        const c = servoControls[name];
        if (c && c.button) claims.push([c.button, `servo "${name}"`, c.controller]);
      });
      const seen = {};
      claims.forEach(([btn, who, pad]) => {
        const key = (pad || 'gamepad1') + ':' + btn;
        if (seen[key]) {
          warnings.push({ type: 'warning', message: `${pad || 'gamepad1'} ${label(btn)} is used by both ${seen[key]} and ${who} — one press triggers both.` });
        } else seen[key] = who;
      });
    })();

    // Check odometry pod port conflicts
    if (odo1Port.hub === odo2Port.hub && odo1Port.port === odo2Port.port) {
      warnings.push({ type: 'error', message: `Odometry pods both on ${odo1Port.hub} hub port ${odo1Port.port}` });
    }
    
    // Check if robot dimensions are reasonable
    if (robotLength < 10 || robotLength > 24) {
      warnings.push({ type: 'warning', message: `Robot length ${robotLength}" seems unusual (typical: 12-18")` });
    }
    if (robotWidth < 10 || robotWidth > 24) {
      warnings.push({ type: 'warning', message: `Robot width ${robotWidth}" seems unusual (typical: 12-18")` });
    }
    
    // Check sensor port conflicts
    sensors.forEach((s1, i) => {
      sensors.forEach((s2, j) => {
        if (i < j && s1.hub === s2.hub && s1.interface === s2.interface && s1.port === s2.port) {
          warnings.push({ type: 'error', message: `Sensor conflict: "${s1.name}" and "${s2.name}" both on ${s1.hub} hub ${s1.interface} port ${s1.port}` });
        }
      });
    });
    
    return warnings;
  };

  const validationWarnings = getValidationWarnings();

  // Save configuration
  const saveConfig = () => {
    const config = {
      name: robotName,
      savedAt: new Date().toISOString(),
      robotLength, robotWidth,
      wheelBrand, wheelType, wheelSize,
      odo1Type, odo1FromBack, odo1FromRight, odo1Reversed, odo1Measures, odo1Port,
      odo2Type, odo2FromBack, odo2FromRight, odo2Reversed, odo2Measures, odo2Port,
      hasOdometry, hasLimelight,
      calParallelTPI, calPerpTPI, calParallelXOffset, calPerpYOffset, calDate,
      imuLocation, imuLogoDirection, imuUsbDirection,
      limelightVersion, limelightFromBack, limelightFromRight, limelightHeight, limelightFacing,
      motors, auxMotors, servos, hasExpansionHub, driveZeroPower,
      hasBlinkin, blinkinPort, blinkinPatterns,
      sensors, aprilTagSize, targetTags,
      numControllers, gamepad1Role, gamepad2Role,
      driveForwardBack, driveStrafe, driveRotate, resetHeadingButton,
      slowModeButton, slowModeSpeed, robotOrientedButton, motorControls, servoControls,
      telemetryHeading, telemetryAprilTag, telemetryDriveMotors, telemetryAuxMotors,
      telemetryServos, telemetryDistanceSensors, telemetryColorSensors,
      telemetryBattery, telemetryLoopTime, telemetryAlerts,
      macros, defaultTolerance
    };
    
    const existingIndex = savedConfigs.findIndex(c => c.name === robotName);
    let newConfigs;
    if (existingIndex >= 0) {
      newConfigs = [...savedConfigs];
      newConfigs[existingIndex] = config;
    } else {
      newConfigs = [...savedConfigs, config];
    }
    
    setSavedConfigs(newConfigs);
    localStorage.setItem('ftc_robot_configs', JSON.stringify(newConfigs));
    setShowSaveModal(false);
  };

  // Load configuration
  const loadConfig = (config) => {
    setRobotName(config.name || 'My Robot');
    setRobotLength(config.robotLength || 18);
    setRobotWidth(config.robotWidth || 18);
    setWheelBrand(config.wheelBrand || 'gobilda');
    setWheelType(config.wheelType || 'mecanum');
    setWheelSize(config.wheelSize || 104);
    setOdo1Type(config.odo1Type || 'gobilda_4bar');
    setOdo1FromBack(config.odo1FromBack || 9);
    setOdo1FromRight(config.odo1FromRight || 9);
    setOdo1Reversed(config.odo1Reversed || false);
    setOdo1Measures(config.odo1Measures || 'forward_back');
    setOdo1Port(config.odo1Port || { hub: 'control', port: 0 });
    setOdo2Type(config.odo2Type || 'gobilda_4bar');
    setOdo2FromBack(config.odo2FromBack || 9);
    setOdo2FromRight(config.odo2FromRight || 9);
    setOdo2Reversed(config.odo2Reversed || false);
    setOdo2Measures(config.odo2Measures || 'left_right');
    setOdo2Port(config.odo2Port || { hub: 'control', port: 1 });
    setHasOdometry(config.hasOdometry !== undefined ? config.hasOdometry : true);
    setHasLimelight(config.hasLimelight !== undefined ? config.hasLimelight : true);
    setCalParallelTPI(config.calParallelTPI !== undefined ? config.calParallelTPI : '');
    setCalPerpTPI(config.calPerpTPI !== undefined ? config.calPerpTPI : '');
    setCalParallelXOffset(config.calParallelXOffset !== undefined ? config.calParallelXOffset : '');
    setCalPerpYOffset(config.calPerpYOffset !== undefined ? config.calPerpYOffset : '');
    setCalDate(config.calDate || '');
    setImuLocation(config.imuLocation || 'control_hub');
    setImuLogoDirection(config.imuLogoDirection || 'UP');
    setImuUsbDirection(config.imuUsbDirection || 'FORWARD');
    setLimelightVersion(config.limelightVersion || '3a');
    setLimelightFromBack(config.limelightFromBack || 9);
    setLimelightFromRight(config.limelightFromRight || 9);
    setLimelightHeight(config.limelightHeight || 8);
    setLimelightFacing(config.limelightFacing || 'FORWARD');
    setMotors(config.motors || []);
    setAuxMotors((config.auxMotors || []).map(m => ({ zeroPower: 'FLOAT', ...m })));
    setDriveZeroPower(config.driveZeroPower || 'BRAKE');
    setServos(config.servos || []);
    setHasExpansionHub(config.hasExpansionHub || false);
    setHasBlinkin(config.hasBlinkin || false);
    setBlinkinPort(config.blinkinPort || { hub: 'control', port: 0 });
    setBlinkinPatterns(config.blinkinPatterns || []);
    setSensors(config.sensors || []);
    setAprilTagSize(config.aprilTagSize || 165);
    setTargetTags(config.targetTags || []);
    setNumControllers(config.numControllers || 2);
    setGamepad1Role(config.gamepad1Role || 'driver');
    setGamepad2Role(config.gamepad2Role || 'operator');
    setDriveForwardBack(config.driveForwardBack || 'left_stick_y');
    setDriveStrafe(config.driveStrafe || 'left_stick_x');
    setDriveRotate(config.driveRotate || 'right_stick_x');
    setResetHeadingButton(config.resetHeadingButton || 'options');
    setSlowModeButton(config.slowModeButton || 'none');
    setSlowModeSpeed(config.slowModeSpeed || 0.4);
    setRobotOrientedButton(config.robotOrientedButton || 'none');
    setMotorControls(config.motorControls || {});
    setServoControls(config.servoControls || {});
    setTelemetryHeading(config.telemetryHeading !== undefined ? config.telemetryHeading : true);
    setTelemetryAprilTag(config.telemetryAprilTag || false);
    setTelemetryDriveMotors(config.telemetryDriveMotors || false);
    setTelemetryAuxMotors(config.telemetryAuxMotors !== undefined ? config.telemetryAuxMotors : true);
    setTelemetryServos(config.telemetryServos !== undefined ? config.telemetryServos : true);
    setTelemetryDistanceSensors(config.telemetryDistanceSensors || false);
    setTelemetryColorSensors(config.telemetryColorSensors || false);
    setTelemetryBattery(config.telemetryBattery || false);
    setTelemetryLoopTime(config.telemetryLoopTime || false);
    setTelemetryAlerts(config.telemetryAlerts || false);
    setMacros(config.macros || []);
    setDefaultTolerance(config.defaultTolerance || 1.0);
    setShowLoadModal(false);
  };

  // Delete saved configuration
  const deleteConfig = (configName) => {
    const newConfigs = savedConfigs.filter(c => c.name !== configName);
    setSavedConfigs(newConfigs);
    localStorage.setItem('ftc_robot_configs', JSON.stringify(newConfigs));
  };

  // Export configuration as JSON file
  const exportConfig = () => {
    const config = {
      name: robotName,
      exportedAt: new Date().toISOString(),
      version: '4.0',
      robotLength, robotWidth,
      wheelBrand, wheelType, wheelSize,
      odo1Type, odo1FromBack, odo1FromRight, odo1Reversed, odo1Measures, odo1Port,
      odo2Type, odo2FromBack, odo2FromRight, odo2Reversed, odo2Measures, odo2Port,
      hasOdometry, hasLimelight,
      calParallelTPI, calPerpTPI, calParallelXOffset, calPerpYOffset, calDate,
      imuLocation, imuLogoDirection, imuUsbDirection,
      limelightVersion, limelightFromBack, limelightFromRight, limelightHeight, limelightFacing,
      motors, auxMotors, servos, hasExpansionHub, driveZeroPower,
      hasBlinkin, blinkinPort, blinkinPatterns,
      sensors, aprilTagSize, targetTags,
      numControllers, gamepad1Role, gamepad2Role,
      driveForwardBack, driveStrafe, driveRotate, resetHeadingButton,
      slowModeButton, slowModeSpeed, robotOrientedButton, motorControls, servoControls,
      telemetryHeading, telemetryAprilTag, telemetryDriveMotors, telemetryAuxMotors,
      telemetryServos, telemetryDistanceSensors, telemetryColorSensors,
      telemetryBattery, telemetryLoopTime, telemetryAlerts,
      macros, defaultTolerance
    };
    
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${robotName.replace(/\s+/g, '_')}_config.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // ------------------------------------------------------------------
  // Macro -> blocking Java, for autonomous.
  //
  // TeleOp macros are a non-blocking state machine, which is right there:
  // blocking would freeze driver control. Autonomous in a LinearOpMode wants
  // the opposite - shootArtifact() should return when the shot is done.
  //
  // BotBuilder owns this translation because BotBuilder owns macros. The
  // result rides along in the robot profile so PathPilot can splice it into a
  // self-contained OpMode without having to understand macro steps itself.
  // ------------------------------------------------------------------
  const DRIVE_STEP_TYPES = ['drive_distance', 'turn_to_heading', 'drive_time', 'drive_to_tag'];
  const isMechanismOnly = (m) => !(m.steps || []).some(st => DRIVE_STEP_TYPES.includes(st.type));

  const macroToAutoJava = (macro) => {
    const body = [];
    const usedMotors = new Set();
    const usedServos = new Set();
    const usedPatterns = new Set();
    let usesBlinkin = false;
    let estSeconds = 0;

    (macro.steps || []).forEach((st, idx) => {
      body.push(`// step ${idx + 1}: ${st.type}`);
      body.push('if (!opModeIsActive()) return;');
      switch (st.type) {
        case 'motor_position':
          usedMotors.add(javaVarName(st.motorName));
          body.push(`${javaVarName(st.motorName)}.setTargetPosition(${st.motorPosition || 0});`);
          body.push(`${javaVarName(st.motorName)}.setMode(DcMotor.RunMode.RUN_TO_POSITION);`);
          body.push(`${javaVarName(st.motorName)}.setPower(${st.motorPower !== undefined ? st.motorPower : 0.8});`);
          body.push('macroTimer.reset();');
          body.push(`while (opModeIsActive() && ${st.motorName}.isBusy() && macroTimer.seconds() < 4.0) idle();`);
          body.push(`${javaVarName(st.motorName)}.setPower(0);`);
          body.push(`${javaVarName(st.motorName)}.setMode(DcMotor.RunMode.RUN_USING_ENCODER);`);
          estSeconds += 1.2;
          break;
        case 'motor_on':
          usedMotors.add(javaVarName(st.motorName));
          body.push(`// latching: keeps running after this macro returns`);
          body.push(`${javaVarName(st.motorName)}.setPower(${st.motorPower !== undefined ? st.motorPower : 1.0});`);
          break;
        case 'motor_off':
          usedMotors.add(javaVarName(st.motorName));
          body.push(`${javaVarName(st.motorName)}.setPower(0);`);
          break;
        case 'motor_time':
          usedMotors.add(javaVarName(st.motorName));
          body.push(`${javaVarName(st.motorName)}.setPower(${st.motorPower !== undefined ? st.motorPower : 1.0});`);
          body.push(`sleep(${Math.round((st.motorDuration !== undefined ? st.motorDuration : 1.0) * 1000)});`);
          body.push(`${javaVarName(st.motorName)}.setPower(0);`);
          estSeconds += (st.motorDuration !== undefined ? Number(st.motorDuration) : 1.0);
          break;
        case 'motor_until_velocity':
          usedMotors.add(javaVarName(st.motorName));
          body.push(`${javaVarName(st.motorName)}.setPower(${st.motorPower !== undefined ? st.motorPower : 1.0});`);
          body.push('macroTimer.reset();');
          body.push(`while (opModeIsActive() && Math.abs(${javaVarName(st.motorName)}.getVelocity()) < ${st.targetVelocity || 0}`);
          body.push(`       && macroTimer.seconds() < ${st.velocityTimeout || 3.0}) idle();`);
          estSeconds += Math.min(Number(st.velocityTimeout || 3.0), 1.5);
          break;
        case 'wait_velocity': {
          usedMotors.add(javaVarName(st.motorName));
          const cmp = st.velocityCondition === 'below' ? '>' : '<';
          body.push('macroTimer.reset();');
          body.push(`while (opModeIsActive() && Math.abs(${javaVarName(st.motorName)}.getVelocity()) ${cmp} ${st.targetVelocity || 0}`);
          body.push(`       && macroTimer.seconds() < ${st.velocityTimeout || 3.0}) idle();`);
          estSeconds += Math.min(Number(st.velocityTimeout || 3.0), 1.0);
          break;
        }
        case 'servo_position':
          usedServos.add(javaVarName(st.servoName));
          body.push(`${javaVarName(st.servoName)}.setPosition(${st.servoPosition !== undefined ? st.servoPosition : 0.5});`);
          body.push('sleep((long)(SERVO_SETTLE * 1000));');
          estSeconds += 0.30;
          break;
        case 'wait':
          body.push(`sleep(${Math.round((st.duration !== undefined ? st.duration : 1.0) * 1000)});`);
          estSeconds += (st.duration !== undefined ? Number(st.duration) : 1.0);
          break;
        case 'led_pattern': {
          usesBlinkin = true;
          const p = String(st.ledPattern || 'DEFAULT');
          usedPatterns.add(p);
          body.push(`blinkin.setPosition(BLINKIN_${p.toUpperCase().replace(/\s+/g, '_')});`);
          break;
        }
        default:
          body.push(`// unsupported step type "${st.type}" - nothing generated`);
      }
      body.push('');
    });

    return {
      body,
      motors: Array.from(usedMotors).filter(Boolean),
      servos: Array.from(usedServos).filter(Boolean),
      usesBlinkin,
      // A pattern entry is { name, pattern, ... }; the actual PWM number lives in
      // blinkinDatabase[pattern].ftcValue = (pulse_us - 600) / 1800.
      // Reading a non-existent `value` field here used to fall through to 0.775,
      // which is OFF — every LED step silently turned the lights off.
      patterns: Array.from(usedPatterns).map(p => {
        const entry = (blinkinPatterns || []).find(bp => bp.name === p);
        const spec = entry ? blinkinDatabase[entry.pattern] : null;
        return {
          constant: 'BLINKIN_' + p.toUpperCase().replace(/\s+/g, '_'),
          value: spec && spec.ftcValue !== undefined ? spec.ftcValue : 0.775,
          patternName: spec ? spec.name : 'unknown (defaulted to OFF)'
        };
      }),
      estSeconds: Math.round(estSeconds * 100) / 100
    };
  };

  // ------------------------------------------------------------------
  // Robot profile export — the contract PathPilot consumes.
  // See ROBOT-PROFILE-SCHEMA.md. Only values describing the physical robot
  // belong here; path-following settings stay in PathPilot.
  // ------------------------------------------------------------------
  const buildRobotProfile = () => {
    const odoPorts = [odo1Port, odo2Port].filter(Boolean);

    // Ports are { hub, port } objects; motors carry hub and port separately.
    const samePort = (x, y) => {
      if (!x || !y) return false;
      const xh = typeof x === 'object' ? x.hub : 'control';
      const xp = typeof x === 'object' ? x.port : x;
      const yh = typeof y === 'object' ? y.hub : 'control';
      const yp = typeof y === 'object' ? y.port : y;
      return xh === yh && Number(xp) === Number(yp);
    };
    const motorOnPort = (p) =>
      (motors || []).concat(auxMotors || [])
        .find(mm => samePort({ hub: mm.hub || 'control', port: mm.port }, p));

    // odoXMeasures is 'forward_back' or 'left_right'
    const parallelIsOdo1 = odo1Measures === 'forward_back';

    const podFor = (isFirst) => {
      const type = isFirst ? odo1Type : odo2Type;
      const port = isFirst ? odo1Port : odo2Port;
      const rev = isFirst ? odo1Reversed : odo2Reversed;
      const fromRight = isFirst ? odo1FromRight : odo2FromRight;
      const fromBack = isFirst ? odo1FromBack : odo2FromBack;
      const host = motorOnPort(port);
      const spec = odoDatabase[type];
      const isParallel = isFirst === parallelIsOdo1;

      // Measured beats theoretical. Only the parallel pod's X offset and the
      // perpendicular pod's Y offset enter the pose maths, so those are the two
      // the spin test produces and the two that get overridden.
      const measuredTPI = isParallel ? calibration.parallelTPI : calibration.perpTPI;
      const theoreticalTPI = spec ? Math.round(spec.ticksPerInch * 10) / 10 : null;
      const geometricX = (Number(robotWidth) / 2) - Number(fromRight || 0);
      const geometricY = Number(fromBack || 0) - (Number(robotLength) / 2);

      return {
        // The encoder plugs into a motor port and is read through that motor's
        // object. Null means nothing is configured on that port.
        hardwareName: host ? host.name : null,
        hub: port && port.hub ? port.hub : 'control',
        port: port && port.port !== undefined ? port.port : null,
        reversed: !!rev,
        ticksPerInch: (measuredTPI !== null && !Number.isNaN(measuredTPI)) ? measuredTPI : theoreticalTPI,
        ticksPerInchSource: (measuredTPI !== null && !Number.isNaN(measuredTPI)) ? 'measured' : 'theoretical',
        xOffsetIn: (isParallel && calibration.parallelXOffset !== null && !Number.isNaN(calibration.parallelXOffset))
          ? calibration.parallelXOffset : geometricX,
        yOffsetIn: (!isParallel && calibration.perpYOffset !== null && !Number.isNaN(calibration.perpYOffset))
          ? calibration.perpYOffset : geometricY,
        offsetSource: isParallel
          ? ((calibration.parallelXOffset !== null && !Number.isNaN(calibration.parallelXOffset)) ? 'measured' : 'geometric')
          : ((calibration.perpYOffset !== null && !Number.isNaN(calibration.perpYOffset)) ? 'measured' : 'geometric'),
        geometricXOffsetIn: geometricX,
        geometricYOffsetIn: geometricY,
        podType: type || null
      };
    };

    const par = podFor(parallelIsOdo1);
    const per = podFor(!parallelIsOdo1);

    const exposedMacros = (macros || [])
      .filter(mm => mm.pathpilotEnabled && isMechanismOnly(mm))
      .map(mm => ({
        name: mm.name,
        method: javaMethodName(mm.name),
        stepCount: (mm.steps || []).length,
        // Blocking Java generated here so PathPilot never has to understand
        // macro steps. It splices this into the OpMode it generates.
        java: macroToAutoJava(mm)
      }));

    const profileWarnings = [];

    [['parallel', par], ['perpendicular', per]].forEach(pair => {
      if (!pair[1].hardwareName) {
        profileWarnings.push(
          'The ' + pair[0] + ' odometry pod is on ' + pair[1].hub + ' hub port ' + pair[1].port +
          ', but no motor is configured on that port. The pod encoder is read through a motor ' +
          'object, so PathPilot cannot name it. Add that motor in BotBuilder, or the generated ' +
          'code will reference the wrong hardware.');
      }
    });

    odoPorts.forEach(p => {
      const host = motorOnPort(p);
      if (host && (motors || []).some(mm => mm.name === host.name)) {
        profileWarnings.push(
          'Odometry pod occupies ' + (p.hub || 'control') + ' hub port ' + p.port +
          ', which belongs to drive motor "' + host.name + '". That motor has no usable ' +
          'built-in encoder - do not use RUN_USING_ENCODER, RUN_TO_POSITION, or getVelocity() on it.');
      }
    });

    const seenPorts = {};
    (motors || []).forEach(mm => {
      const key = (mm.hub || 'control') + ' port ' + mm.port;
      if (seenPorts[key]) {
        profileWarnings.push('Drive motors "' + seenPorts[key] + '" and "' + mm.name +
          '" are both on ' + key + '. One of them is misconfigured.');
      } else seenPorts[key] = mm.name;
    });

    exposedMacros.forEach(em => {
      (em.java.patterns || []).forEach(pt => {
        if (String(pt.patternName).startsWith('unknown'))
          profileWarnings.push('Macro "' + em.name + '" uses an LED pattern that could not be resolved; it will emit OFF.');
      });
    });

    (macros || []).forEach(mm => {
      if (mm.pathpilotEnabled && !isMechanismOnly(mm))
        profileWarnings.push('Macro "' + mm.name + '" is flagged for PathPilot but contains driving steps; it was excluded.');
      if (mm.pathpilotEnabled && isMechanismOnly(mm) && (mm.steps || []).length === 0)
        profileWarnings.push('Macro "' + mm.name + '" is flagged for PathPilot but has no steps; it generates an empty method.');
    });

    if (!hasOdometry) {
      profileWarnings.push('This robot has no odometry. PathPilot cannot plan autonomous paths without it — driveTo has no way to know where the robot is.');
    }
    if (hasOdometry && calibration.status !== 'calibrated') {
      profileWarnings.push(calibration.status === 'partial'
        ? `Odometry is only partially calibrated (${calibration.have} of 4 values measured); the rest are theoretical.`
        : 'Odometry is uncalibrated. Run the Odometry Calibration OpMode and enter its results in the Odometry tab.');
    }

    return {
      pathpilotProfile: 1,
      name: robotName,
      generatedBy: 'BotBuilder v5.0',
      updatedAt: new Date().toISOString(),
      chassis: {
        type: 'mecanum',
        lengthIn: Number(robotLength),
        widthIn: Number(robotWidth),
        heightIn: null,
        weightLb: null
      },
      drive: {
        motors: Object.fromEntries((motors || []).map(mm => [mm.name, {
          hardwareName: mm.name, hub: mm.hub || 'control', port: mm.port, reversed: !!mm.reversed
        }])),
        // Recorded for reference. PathPilot forces BRAKE in autonomous whatever
        // this says, because a coasting robot cannot settle inside tolerance.
        teleopZeroPower: driveZeroPower,
        wheelDiameterMm: Number(wheelSize) || null,
        wheelDiameterIn: wheelSize ? Math.round((Number(wheelSize) / 25.4) * 1000) / 1000 : null,
        measured: { maxVelocityInPerSec: null, maxAccelInPerSec2: null, maxTurnRateDegPerSec: null }
      },
      odometry: hasOdometry ? {
        type: 'twoPodImu',
        parallel: par,
        perpendicular: per,
        calibration: { status: calibration.status, date: calibration.date }
      } : { type: 'none' },
      imu: {
        source: imuLocation || 'control_hub',
        logoDirection: imuLogoDirection,
        usbDirection: imuUsbDirection
      },
      limelight: (hasLimelight && limelightVersion) ? {
        present: true, model: limelightVersion,
        xOffsetIn: (Number(robotWidth) / 2) - Number(limelightFromRight || 0),
        yOffsetIn: Number(limelightFromBack || 0) - (Number(robotLength) / 2),
        heightIn: Number(limelightHeight) || null,
        facing: limelightFacing, pipeline: 0,
        tagSizeMm: Number(aprilTagSize) || null
      } : { present: false },
      blinkin: hasBlinkin ? { present: true, hardwareName: 'blinkin' } : { present: false },
      auxMotors: (auxMotors || []).map(mm => ({
        hardwareName: mm.name, hub: mm.hub || 'control', port: mm.port, reversed: !!mm.reversed,
        zeroPower: mm.zeroPower || 'FLOAT'
      })),
      servos: (servos || []).map(sv => ({ hardwareName: sv.name, port: sv.port })),
      macros: exposedMacros,
      warnings: profileWarnings
    };
  };

  // ------------------------------------------------------------------
  // Motor test OpMode.
  //
  // For a new chassis, before any direction is known. Every configured motor is
  // declared and one runs at a time, at FORWARD with no direction applied, so
  // what you see is what the motor physically does when told to go forward.
  // Note which ones turn the wrong way, then set Reverse in BotBuilder.
  //
  // Deliberately does not apply the configured direction: the question here is
  // "which way does this motor turn", not "is my config right".
  // ------------------------------------------------------------------
  const generateMotorTest = () => {
    const all = (motors || []).map(m => ({ ...m, role: 'drive' }))
      .concat((auxMotors || []).map(m => ({ ...m, role: 'aux' })));

    if (!all.length) {
      return '// No motors configured yet. Add at least one in the Drive or\n'
           + '// Motors tab and this OpMode will appear here.';
    }

    // A motor whose encoder port carries an odometry pod reports the pod, not
    // the motor, so its tick count means something different from the others.
    const samePort = (x, y) => {
      if (!x || !y) return false;
      const xh = typeof x === 'object' ? x.hub : 'control';
      const xp = typeof x === 'object' ? x.port : x;
      return xh === (y.hub || 'control') && Number(xp) === Number(y.port);
    };
    const podOn = (m) => hasOdometry &&
      ((odo1Port && samePort(odo1Port, m)) || (odo2Port && samePort(odo2Port, m)));

    const className = javaClassName(robotName, 'MotorTest');
    const L = [];
    const P = (...xs) => xs.forEach(x => L.push(x));

    P('package org.firstinspires.ftc.teamcode;',
      '',
      'import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;',
      'import com.qualcomm.robotcore.eventloop.opmode.TeleOp;',
      'import com.qualcomm.robotcore.hardware.DcMotor;',
      'import com.qualcomm.robotcore.hardware.DcMotorEx;',
      'import com.qualcomm.robotcore.hardware.DcMotorSimple;',
      '',
      '/**',
      ` * ${className} — generated by BotBuilder from the "${robotName}" configuration.`,
      ' *',
      ' * Runs one motor at a time so you can see which way it turns.',
      ' *',
      ' * NOTHING IS REVERSED HERE. Every motor is left at Direction.FORWARD',
      ' * whatever BotBuilder has configured, because on a new chassis the point',
      ' * is to find out which way "forward" actually turns the wheel. Watch the',
      ' * wheel, and if it turns the wrong way, tick Reverse Direction for that',
      ' * motor in BotBuilder. The configured setting is shown in telemetry so',
      ' * you can compare, but it is not applied.',
      ' *',
      ' * CONTROLS',
      ' *   D-pad left / right   choose a motor',
      ' *   right bumper         run forward at the test power',
      ' *   left bumper          run reverse at the test power',
      ' *   triggers             variable power, for finding the breakaway point',
      ' *   D-pad up / down      adjust the test power by 0.05',
      ' *',
      ' * FINDING BREAKAWAY POWER',
      ' *   Squeeze the right trigger slowly until the wheel just starts to move',
      ' *   from a standstill. That reading is the lowest power that beats static',
      ' *   friction — a little above it is a good value for MIN_POWER.',
      ' */',
      `@TeleOp(name = "${robotName} Motor Test", group = "Diagnostic")`,
      `public class ${className} extends LinearOpMode {`,
      '');

    P('    private static final String[] NAMES = {',
      '        ' + all.map(m => `"${m.name}"`).join(', '),
      '    };',
      '    private static final String[] PORTS = {',
      '        ' + all.map(m => `"${m.hub || 'control'} hub, port ${m.port}"`).join(', '),
      '    };',
      '    private static final String[] ROLES = {',
      '        ' + all.map(m => `"${m.role}"`).join(', '),
      '    };',
      '    /** What BotBuilder has configured. Shown for comparison, NOT applied. */',
      '    private static final String[] CONFIGURED = {',
      '        ' + all.map(m => `"${m.reversed ? 'REVERSE' : 'FORWARD'}"`).join(', '),
      '    };',
      '    /** True where the encoder port carries an odometry pod, not this motor. */',
      '    private static final boolean[] READS_POD = {',
      '        ' + all.map(m => (podOn(m) ? 'true' : 'false')).join(', '),
      '    };',
      '',
      `    private final DcMotorEx[] motorList = new DcMotorEx[${all.length}];`,
      '    private int selected = 0;',
      '    private double testPower = 0.30;',
      '',
      '    private boolean prevLeft, prevRight, prevUp, prevDown;',
      '');

    P('    @Override',
      '    public void runOpMode() {',
      '        for (int i = 0; i < NAMES.length; i++) {',
      '            motorList[i] = hardwareMap.get(DcMotorEx.class, NAMES[i]);',
      '            // Left FORWARD on purpose — see the class comment.',
      '            motorList[i].setDirection(DcMotorSimple.Direction.FORWARD);',
      '            motorList[i].setZeroPowerBehavior(DcMotor.ZeroPowerBehavior.BRAKE);',
      '            // Raw power, so what you command is what the motor gets.',
      '            motorList[i].setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);',
      '        }',
      '',
      `        telemetry.addLine("${robotName} motor test");`,
      '        telemetry.addData("motors", NAMES.length);',
      '        telemetry.addLine("");',
      '        telemetry.addLine("Nothing is reversed here. Watch which way each");',
      '        telemetry.addLine("wheel turns on the right bumper, and set Reverse");',
      '        telemetry.addLine("in BotBuilder for any that are backwards.");',
      '        telemetry.update();',
      '',
      '        waitForStart();',
      '',
      '        while (opModeIsActive()) {',
      '            boolean left = gamepad1.dpad_left, right = gamepad1.dpad_right;',
      '            boolean up = gamepad1.dpad_up, down = gamepad1.dpad_down;',
      '',
      '            if (right && !prevRight) { stopAll(); selected = (selected + 1) % NAMES.length; }',
      '            if (left && !prevLeft) { stopAll(); selected = (selected + NAMES.length - 1) % NAMES.length; }',
      '            if (up && !prevUp) testPower = Math.min(1.0, testPower + 0.05);',
      '            if (down && !prevDown) testPower = Math.max(0.05, testPower - 0.05);',
      '            prevLeft = left; prevRight = right; prevUp = up; prevDown = down;',
      '',
      '            // Triggers win when squeezed, so variable control overrides the',
      '            // fixed test power without needing a mode switch.',
      '            double trigger = gamepad1.right_trigger - gamepad1.left_trigger;',
      '            double power;',
      '            if (Math.abs(trigger) > 0.02) {',
      '                power = trigger;',
      '            } else if (gamepad1.right_bumper) {',
      '                power = testPower;',
      '            } else if (gamepad1.left_bumper) {',
      '                power = -testPower;',
      '            } else {',
      '                power = 0;',
      '            }',
      '',
      '            for (int i = 0; i < motorList.length; i++) {',
      '                motorList[i].setPower(i == selected ? power : 0);',
      '            }',
      '',
      '            report(power);',
      '            telemetry.update();',
      '        }',
      '        stopAll();',
      '    }',
      '',
      '    private void stopAll() {',
      '        for (DcMotorEx m : motorList) m.setPower(0);',
      '    }',
      '',
      '    private void report(double power) {',
      '        telemetry.addData("motor", "%d of %d   %s", selected + 1, NAMES.length, NAMES[selected]);',
      '        telemetry.addData("port", PORTS[selected] + "   (" + ROLES[selected] + ")");',
      '        telemetry.addData("configured in BotBuilder", CONFIGURED[selected] + "   (not applied here)");',
      '        telemetry.addData("test power", "%.2f   (d-pad up/down)", testPower);',
      '        telemetry.addLine("");',
      '        telemetry.addData("power", "%+.3f", power);',
      '',
      '        int ticks = motorList[selected].getCurrentPosition();',
      '        double vel = motorList[selected].getVelocity();',
      '        if (READS_POD[selected]) {',
      '            telemetry.addData("encoder", "%d ticks  <-- ODOMETRY POD, not this motor", ticks);',
      '        } else if (ticks == 0 && Math.abs(vel) < 0.5 && Math.abs(power) > 0.15) {',
      '            telemetry.addData("encoder", "0 ticks  <-- no encoder, or not plugged in");',
      '        } else {',
      '            telemetry.addData("encoder", "%d ticks   %s", ticks,',
      '                    Math.abs(vel) < 0.5 ? "steady" : (vel > 0 ? "counting UP" : "counting DOWN"));',
      '        }',
      '        telemetry.addData("velocity", "%.0f ticks/sec", vel);',
      '        telemetry.addLine("");',
      '        telemetry.addLine("d-pad L/R motor  ·  bumpers run  ·  triggers vary");',
      '    }',
      '}');

    return L.join('\n');
  };

  // ------------------------------------------------------------------
  // OdometryCalibration.java — self-contained, generated from this config.
  //
  // The previous hand-written version hardcoded motor names and silently read
  // zero when they didn't match the robot. Generating it removes that whole
  // class of problem: the names come from the same config the profile does.
  //
  // Includes a PORT SCAN so "which port is my pod actually on" is something you
  // read off the screen instead of deduce.
  // ------------------------------------------------------------------
  const generateOdometryCalibration = () => {
    if (!hasOdometry) {
      return '// This robot is configured without odometry pods.\n' +
             '// Tick "This robot has odometry pods" in the Odometry tab to generate\n' +
             '// the calibration OpMode.';
    }
    const parallelIsOdo1 = odo1Measures === 'forward_back';
    const samePort = (x, y) => {
      if (!x || !y) return false;
      const xh = typeof x === 'object' ? x.hub : 'control';
      const xp = typeof x === 'object' ? x.port : x;
      const yh = typeof y === 'object' ? y.hub : 'control';
      const yp = typeof y === 'object' ? y.port : y;
      return xh === yh && Number(xp) === Number(yp);
    };
    const allMotors = (motors || []).concat(auxMotors || []);
    const motorOnPort = (p) => allMotors.find(mm => samePort({ hub: mm.hub || 'control', port: mm.port }, p));

    const parPort = parallelIsOdo1 ? odo1Port : odo2Port;
    const perPort = parallelIsOdo1 ? odo2Port : odo1Port;
    const parHost = motorOnPort(parPort);
    const perHost = motorOnPort(perPort);
    const parRev = parallelIsOdo1 ? odo1Reversed : odo2Reversed;
    const perRev = parallelIsOdo1 ? odo2Reversed : odo1Reversed;
    const parSpec = odoDatabase[parallelIsOdo1 ? odo1Type : odo2Type];
    const perSpec = odoDatabase[parallelIsOdo1 ? odo2Type : odo1Type];
    // Re-running against measured values shows drift from the last calibration
    // rather than from theory, which is the more useful comparison.
    const parTPI = (calibration.parallelTPI !== null && !Number.isNaN(calibration.parallelTPI))
      ? calibration.parallelTPI : (parSpec ? parSpec.ticksPerInch : 505.2);
    const perTPI = (calibration.perpTPI !== null && !Number.isNaN(calibration.perpTPI))
      ? calibration.perpTPI : (perSpec ? perSpec.ticksPerInch : 505.2);
    const parXOff = (calibration.parallelXOffset !== null && !Number.isNaN(calibration.parallelXOffset))
      ? calibration.parallelXOffset : 0;
    const perYOff = (calibration.perpYOffset !== null && !Number.isNaN(calibration.perpYOffset))
      ? calibration.perpYOffset : 0;

    const className = javaClassName(robotName, 'OdometryCalibration');
    const L = [];
    const P = (...xs) => xs.forEach(x => L.push(x));

    P('package org.firstinspires.ftc.teamcode;',
      '',
      'import com.qualcomm.hardware.rev.RevHubOrientationOnRobot;',
      'import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;',
      'import com.qualcomm.robotcore.eventloop.opmode.TeleOp;',
      'import com.qualcomm.robotcore.hardware.DcMotor;',
      'import com.qualcomm.robotcore.hardware.DcMotorEx;',
      'import com.qualcomm.robotcore.hardware.IMU;',
      '',
      'import org.firstinspires.ftc.robotcore.external.navigation.AngleUnit;',
      '',
      '/**',
      ` * ${className} — generated by BotBuilder from the "${robotName}" configuration.`,
      ' *',
      ' * Measures the four odometry numbers that cannot be derived on paper, and',
      ' * prints values to type back into BotBuilder.',
      ' *',
      ' *   0. PORT SCAN  see raw ticks on every motor port at once',
      ' *   1. STRAIGHT   push a known distance forward  -> parallel ticks/inch',
      ' *   2. STRAFE     push a known distance left     -> perpendicular ticks/inch',
      ' *   3. SPIN       rotate N turns in place        -> both pod offsets',
      ' *',
      ' * WHY THE SPIN TEST WORKS',
      ' *   Spinning in place moves the robot centre nowhere, so every tick a pod',
      ' *   registers comes from its offset:',
      ' *     offset = -podInches / headingRadians',
      ' *   Measured offsets beat tape-measured ones because they capture the true',
      ' *   centre of rotation, not the geometric centre of the chassis.',
      ' *',
      ' * A WARNING ABOUT WHOLE ROTATIONS',
      ' *   Ten full turns self-cancels — the error rotates uniformly and integrates',
      ' *   away. "Spin it ten times and see if the pose returns" passes with',
      ' *   completely wrong offsets. A single quarter turn is what exposes them.',
      ' *',
      ' * Self-contained. Regenerate from BotBuilder rather than editing here.',
      ' */',
      `@TeleOp(name = "${robotName} Odometry Calibration", group = "Calibration")`,
      `public class ${className} extends LinearOpMode {`,
      '');

    P('    // ================= from your BotBuilder configuration =================',
      `    /** Motor port the forward/back pod plugs into: ${parPort && parPort.hub} hub port ${parPort && parPort.port}. */`,
      `    public static final String PARALLEL_MOTOR = "${parHost ? parHost.name : ''}";`,
      `    /** Motor port the left/right pod plugs into: ${perPort && perPort.hub} hub port ${perPort && perPort.port}. */`,
      `    public static final String PERPENDICULAR_MOTOR = "${perHost ? perHost.name : ''}";`,
      '',
      `    public static final boolean PARALLEL_REVERSED = ${!!parRev};`,
      `    public static final boolean PERPENDICULAR_REVERSED = ${!!perRev};`,
      '',
      `    // ${calibration.status === 'calibrated' ? 'MEASURED ' + (calibration.date || '') : calibration.status === 'partial' ? 'PARTLY MEASURED - the rest are theoretical' : 'THEORETICAL - not yet measured'}`,
      `    public static final double PARALLEL_TICKS_PER_INCH = ${parTPI.toFixed(1)};`,
      `    public static final double PERPENDICULAR_TICKS_PER_INCH = ${perTPI.toFixed(1)};`,
      `    public static final double PARALLEL_X_OFFSET = ${parXOff};`,
      `    public static final double PERPENDICULAR_Y_OFFSET = ${perYOff};`,
      '',
      `    public static final double STRAIGHT_TEST_INCHES = 48.0;`,
      `    public static final double STRAFE_TEST_INCHES = 48.0;`,
      `    public static final double SPIN_TEST_REVOLUTIONS = 10.0;`,
      '');

    // Every motor gets scanned, so a mis-wired pod is visible rather than silent.
    P('    // Every motor port, for the scan.',
      `    private static final String[] ALL_MOTORS = { ${allMotors.map(mm => `"${mm.name}"`).join(', ')} };`,
      `    private static final String[] ALL_PORTS = { ${allMotors.map(mm => `"${mm.hub || 'control'} ${mm.port}"`).join(', ')} };`,
      `    private final DcMotorEx[] scan = new DcMotorEx[${allMotors.length}];`,
      `    private final int[] scanZero = new int[${allMotors.length}];`,
      '');

    P('    private DcMotorEx parallelPod, perpendicularPod;',
      '    private IMU imu;',
      '',
      '    private int test = 0;',
      '    private static final int TEST_COUNT = 5;',
      '',
      '    private double straightTicksPerInch = Double.NaN;',
      '    private double strafeTicksPerInch = Double.NaN;',
      '    private double parallelXOffset = Double.NaN;',
      '    private double perpendicularYOffset = Double.NaN;',
      '',
      '    private int zeroParallel, zeroPerpendicular;',
      '    private double unwrappedYaw, previousYaw;',
      '    private double poseX, poseY;',
      '    private boolean prevA, prevB, prevUp, prevDown;',
      '');

    P('    @Override',
      '    public void runOpMode() {');
    if (parHost) P(`        parallelPod = hardwareMap.get(DcMotorEx.class, PARALLEL_MOTOR);`);
    if (perHost) P(`        perpendicularPod = hardwareMap.get(DcMotorEx.class, PERPENDICULAR_MOTOR);`);
    P('');
    allMotors.forEach((mm, i) => P(`        scan[${i}] = hardwareMap.get(DcMotorEx.class, "${mm.name}");`));
    P('',
      '        imu = hardwareMap.get(IMU.class, "imu");',
      '        imu.initialize(new IMU.Parameters(new RevHubOrientationOnRobot(',
      `                RevHubOrientationOnRobot.LogoFacingDirection.${imuLogoDirection},`,
      `                RevHubOrientationOnRobot.UsbFacingDirection.${imuUsbDirection})));`,
      '        imu.resetYaw();',
      '');

    if (!parHost || !perHost) {
      P('        telemetry.addLine("CONFIG PROBLEM");');
      if (!parHost) P(`        telemetry.addLine("No motor on the forward/back pod's port (${parPort && parPort.hub} ${parPort && parPort.port}).");`);
      if (!perHost) P(`        telemetry.addLine("No motor on the left/right pod's port (${perPort && perPort.hub} ${perPort && perPort.port}).");`);
      P('        telemetry.addLine("Use the PORT SCAN to find which port actually moves.");',
        '        telemetry.addLine("");');
    }

    P('        telemetry.addLine("ODOMETRY CALIBRATION");',
      '        telemetry.addLine("");',
      '        telemetry.addLine("D-pad up/down : choose test");',
      '        telemetry.addLine("A             : zero this test");',
      '        telemetry.addLine("B             : record result");',
      '        telemetry.addLine("");',
      '        telemetry.addLine("Start on TEST 0 (port scan) if you are unsure");',
      '        telemetry.addLine("which port your pods are plugged into.");',
      '        telemetry.update();',
      '',
      '        waitForStart();',
      '        zero();',
      '        previousYaw = rawYaw();',
      '',
      '        while (opModeIsActive()) {',
      '            trackYaw();',
      '            updatePose();',
      '',
      '            boolean a = gamepad1.a, b = gamepad1.b;',
      '            boolean up = gamepad1.dpad_up, down = gamepad1.dpad_down;',
      '            if (up && !prevUp) { test = (test + TEST_COUNT - 1) % TEST_COUNT; zero(); }',
      '            if (down && !prevDown) { test = (test + 1) % TEST_COUNT; zero(); }',
      '            if (a && !prevA) zero();',
      '            if (b && !prevB) record();',
      '            prevA = a; prevB = b; prevUp = up; prevDown = down;',
      '',
      '            render();',
      '            telemetry.update();',
      '        }',
      '    }',
      '');

    P('    private double rawYaw() {',
      '        return imu.getRobotYawPitchRollAngles().getYaw(AngleUnit.DEGREES);',
      '    }',
      '',
      '    private int parallelTicks() {',
      '        if (parallelPod == null) return 0;',
      '        int t = parallelPod.getCurrentPosition();',
      '        return PARALLEL_REVERSED ? -t : t;',
      '    }',
      '',
      '    private int perpendicularTicks() {',
      '        if (perpendicularPod == null) return 0;',
      '        int t = perpendicularPod.getCurrentPosition();',
      '        return PERPENDICULAR_REVERSED ? -t : t;',
      '    }',
      '',
      '    private void zero() {',
      '        zeroParallel = parallelTicks();',
      '        zeroPerpendicular = perpendicularTicks();',
      '        for (int i = 0; i < scan.length; i++) scanZero[i] = scan[i].getCurrentPosition();',
      '        unwrappedYaw = 0;',
      '        previousYaw = rawYaw();',
      '        poseX = 0; poseY = 0;',
      '    }',
      '',
      '    /** IMU yaw wraps at +/-180; accumulate so multi-turn spins keep counting. */',
      '    private void trackYaw() {',
      '        double now = rawYaw();',
      '        unwrappedYaw += wrap(now - previousYaw);',
      '        previousYaw = now;',
      '    }',
      '',
      '    private int deltaParallel() { return parallelTicks() - zeroParallel; }',
      '    private int deltaPerpendicular() { return perpendicularTicks() - zeroPerpendicular; }',
      '');

    P('    /** Rough pose for the verify step, using whatever constants are set now. */',
      '    private void updatePose() {',
      '        double heading = Math.toRadians(-unwrappedYaw);',
      '        double f = deltaParallel() / tpiParallel();',
      '        double l = deltaPerpendicular() / tpiPerpendicular();',
      '        poseX = f * Math.sin(heading) - l * Math.cos(heading);',
      '        poseY = f * Math.cos(heading) + l * Math.sin(heading);',
      '    }',
      '',
      '    private double tpiParallel() {',
      '        return Double.isNaN(straightTicksPerInch) ? PARALLEL_TICKS_PER_INCH : straightTicksPerInch;',
      '    }',
      '',
      '    private double tpiPerpendicular() {',
      '        return Double.isNaN(strafeTicksPerInch) ? PERPENDICULAR_TICKS_PER_INCH : strafeTicksPerInch;',
      '    }',
      '',
      '    private void record() {',
      '        switch (test) {',
      '            case 1:',
      '                straightTicksPerInch = deltaParallel() / STRAIGHT_TEST_INCHES;',
      '                break;',
      '            case 2:',
      '                strafeTicksPerInch = deltaPerpendicular() / STRAFE_TEST_INCHES;',
      '                break;',
      '            case 3: {',
      '                // Field heading is clockwise-positive; IMU yaw is counter-clockwise.',
      '                double headingRad = Math.toRadians(-unwrappedYaw);',
      '                if (Math.abs(headingRad) < 1e-6) break;',
      '                parallelXOffset = -(deltaParallel() / tpiParallel()) / headingRad;',
      '                perpendicularYOffset = -(deltaPerpendicular() / tpiPerpendicular()) / headingRad;',
      '                break;',
      '            }',
      '            default:',
      '                break;',
      '        }',
      '    }',
      '');

    P('    private void render() {',
      '        switch (test) {',
      '            case 0:',
      '                telemetry.addLine("TEST 0/4  PORT SCAN");',
      '                telemetry.addLine("Push the robot and watch which ports move.");',
      '                telemetry.addLine("A pod shows thousands of ticks; a bare motor port shows 0.");',
      '                telemetry.addLine("");',
      '                for (int i = 0; i < scan.length; i++) {',
      '                    telemetry.addData(ALL_MOTORS[i] + " (" + ALL_PORTS[i] + ")",',
      '                            scan[i].getCurrentPosition() - scanZero[i]);',
      '                }',
      '                telemetry.addLine("");',
      '                telemetry.addData("configured parallel", PARALLEL_MOTOR.isEmpty() ? "NONE" : PARALLEL_MOTOR);',
      '                telemetry.addData("configured perpendicular", PERPENDICULAR_MOTOR.isEmpty() ? "NONE" : PERPENDICULAR_MOTOR);',
      '                telemetry.addLine("If the moving ports are not these two, fix the");',
      '                telemetry.addLine("odometry ports in BotBuilder and regenerate.");',
      '                break;',
      '',
      '            case 1:',
      '                telemetry.addLine("TEST 1/4  STRAIGHT");',
      '                telemetry.addData("Push FORWARD exactly", "%.1f in, then press B", STRAIGHT_TEST_INCHES);',
      '                telemetry.addLine("");',
      '                telemetry.addData("parallel ticks", deltaParallel());',
      '                telemetry.addData("implies", "%.2f in", deltaParallel() / PARALLEL_TICKS_PER_INCH);',
      '                telemetry.addData("perp drift", deltaPerpendicular() + "  (keep near 0)");',
      '                break;',
      '',
      '            case 2:',
      '                telemetry.addLine("TEST 2/4  STRAFE");',
      '                telemetry.addData("Push LEFT exactly", "%.1f in, then press B", STRAFE_TEST_INCHES);',
      '                telemetry.addLine("");',
      '                telemetry.addData("perp ticks", deltaPerpendicular());',
      '                telemetry.addData("implies", "%.2f in", deltaPerpendicular() / PERPENDICULAR_TICKS_PER_INCH);',
      '                telemetry.addData("parallel drift", deltaParallel() + "  (keep near 0)");',
      '                break;',
      '',
      '            case 3:',
      '                telemetry.addLine("TEST 3/4  SPIN");',
      '                telemetry.addData("Rotate CLOCKWISE", "%.0f turns in place, then press B", SPIN_TEST_REVOLUTIONS);',
      '                telemetry.addLine("Keep the centre of rotation fixed.");',
      '                telemetry.addLine("");',
      '                telemetry.addData("turns so far", "%.2f", -unwrappedYaw / 360.0);',
      '                telemetry.addData("parallel ticks", deltaParallel());',
      '                telemetry.addData("perp ticks", deltaPerpendicular());',
      '                break;',
      '',
      '            case 4:',
      '                telemetry.addLine("TEST 4/4  VERIFY");',
      '                telemetry.addLine("Type the results into BotBuilder, regenerate,");',
      '                telemetry.addLine("then push a square here and check it returns to 0,0.");',
      '                telemetry.addLine("");',
      '                telemetry.addData("x", "%.2f", poseX);',
      '                telemetry.addData("y", "%.2f", poseY);',
      '                telemetry.addData("heading", "%.1f", -unwrappedYaw);',
      '                telemetry.addData("error from origin", "%.2f in", Math.hypot(poseX, poseY));',
      '                break;',
      '',
      '            default:',
      '                break;',
      '        }',
      '',
      '        telemetry.addLine("");',
      '        telemetry.addLine("RESULTS  (type these into BotBuilder)");',
      '        report("parallel ticks/inch", straightTicksPerInch, PARALLEL_TICKS_PER_INCH);',
      '        report("perp ticks/inch", strafeTicksPerInch, PERPENDICULAR_TICKS_PER_INCH);',
      '        report("parallel X offset", parallelXOffset, PARALLEL_X_OFFSET);',
      '        report("perp Y offset", perpendicularYOffset, PERPENDICULAR_Y_OFFSET);',
      '    }',
      '',
      '    private void report(String name, double measured, double current) {',
      '        if (Double.isNaN(measured)) {',
      '            telemetry.addData(name, "not measured (now %.3f)", current);',
      '        } else if (current == 0) {',
      '            telemetry.addData(name, "%.3f", measured);',
      '        } else {',
      '            telemetry.addData(name, "%.3f   (was %.3f, %+.1f%%)",',
      '                    measured, current, (measured - current) / current * 100.0);',
      '        }',
      '    }',
      '',
      '    /** Folds an angle into (-180, 180]. */',
      '    private static double wrap(double deg) {',
      '        double d = (deg + 180.0) % 360.0;',
      '        if (d <= 0) d += 360.0;',
      '        return d - 180.0;',
      '    }',
      '}');

    return L.join('\n');
  };

${javaVarName(m.name)}.setDirection(DcMotorSimple.Direction.${m.reversed ? 'REVERSE' : 'FORWARD'});

// Size: ${wheelSize}mm

// ----- DRIVE MOTORS -----
// Declarations
${motors.map(m => `private DcMotor ${m.name};  // ${motorDatabase[m.type]?.name}`).join('\n')}

// Initialization (in init)
${driveMotorCode}

${auxMotors.length > 0 ? `// ----- OTHER MOTORS (arm, intake, etc.) -----
// Declarations
${auxMotors.map(m => `private DcMotor ${m.name};  // ${motorDatabase[m.type]?.name}`).join('\n')}

// Initialization (in init)
${auxMotorCode}
` : '// No auxiliary motors configured'}

// ----- SERVOS -----
${servos.length > 0 ? `// Declarations
${servos.map(s => `private Servo ${s.name};  // ${servoDatabase[s.type]?.name}`).join('\n')}

// Initialization (in init)
${servoCode}` : '// No servos configured'}

// ----- ODOMETRY CONFIGURATION -----

// Pod 1: ${odo1Measures === 'forward_back' ? 'Forward/Back' : 'Left/Right (Strafe)'} (${odo1Specs.name})
// Encoder port: ${odo1Port.hub} hub, port ${odo1Port.port}
private static final double ODO_POD1_TICKS_PER_INCH = ${odo1Specs.ticksPerInch.toFixed(1)};
private static final double ODO_POD1_X_OFFSET = ${offsets.odo1.x.toFixed(3)};  // inches from center (+ right, - left)
private static final double ODO_POD1_Y_OFFSET = ${offsets.odo1.y.toFixed(3)};  // inches from center (+ forward, - back)
private static final boolean ODO_POD1_REVERSED = ${odo1Reversed};
private static final String ODO_POD1_MEASURES = "${odo1Measures === 'forward_back' ? 'FORWARD_BACK' : 'LEFT_RIGHT'}";

// Pod 2: ${odo2Measures === 'forward_back' ? 'Forward/Back' : 'Left/Right (Strafe)'} (${odo2Specs.name})
// Encoder port: ${odo2Port.hub} hub, port ${odo2Port.port}
private static final double ODO_POD2_TICKS_PER_INCH = ${odo2Specs.ticksPerInch.toFixed(1)};
private static final double ODO_POD2_X_OFFSET = ${offsets.odo2.x.toFixed(3)};  // inches from center (+ right, - left)
private static final double ODO_POD2_Y_OFFSET = ${offsets.odo2.y.toFixed(3)};  // inches from center (+ forward, - back)
private static final boolean ODO_POD2_REVERSED = ${odo2Reversed};
private static final String ODO_POD2_MEASURES = "${odo2Measures === 'forward_back' ? 'FORWARD_BACK' : 'LEFT_RIGHT'}";

// ----- IMU CONFIGURATION -----
// Location: ${imuLocation === 'control_hub' ? 'Control Hub' : 'Expansion Hub'}
RevHubOrientationOnRobot.LogoFacingDirection logoDirection = RevHubOrientationOnRobot.LogoFacingDirection.${imuLogoDirection};
RevHubOrientationOnRobot.UsbFacingDirection usbDirection = RevHubOrientationOnRobot.UsbFacingDirection.${imuUsbDirection};
RevHubOrientationOnRobot orientationOnRobot = new RevHubOrientationOnRobot(logoDirection, usbDirection);

// ----- LIMELIGHT CONFIGURATION -----

private static final double LIMELIGHT_HEIGHT = ${limelightHeight};  // inches from ground

// ----- APRILTAG CONFIGURATION -----
private static final double APRILTAG_SIZE_MM = ${aprilTagSize};  // ${(aprilTagSize / 25.4).toFixed(2)} inches
${targetTags.map(t => `private static final int TAG_${t.name.toUpperCase().replace(/\s+/g, '_')} = ${t.tagId};  // ${t.name}`).join('\n')}

${hasBlinkin ? `// ----- BLINKIN LED CONFIGURATION -----

${blinkinPatterns.map(p => `private static final double BLINKIN_${p.name.toUpperCase().replace(/\s+/g, '_')} = ${blinkinDatabase[p.pattern]?.ftcValue.toFixed(3)};  // ${blinkinDatabase[p.pattern]?.name}`).join('\n')}

` : '// No Blinkin configured'}

${sensors.length > 0 ? `// ----- SENSORS -----
${sensors.map(s => {

// ${s.name} = hardwareMap.get(${sensorInfo.type === 'color' ? 'ColorSensor' : sensorInfo.type === 'distance' ? 'DistanceSensor' : 'I2cDevice'}.class, "${s.name}");`;

// ${s.name} = hardwareMap.get(DigitalChannel.class, "${s.name}");`;
  } else if (sensorInfo?.interface === 'analog') {
    return `// ${s.name} - ${sensorInfo.name} (Analog, ${s.hub} hub port ${s.port})
// ${s.name} = hardwareMap.get(AnalogInput.class, "${s.name}");`;

  // A macro can outlive the hardware it was written against — rename a motor,
  // delete it, or start a new robot from an old config, and the step still
  // points at something that no longer exists. Emitting it produces a file that
  // cannot compile, so the step is commented out and reported instead.
  // Generate Complete TeleOp Code
  const generateCompleteTeleOp = () => {
    // With a single controller everything is on gamepad1. Falling back to
    // gamepad2 there binds mechanisms to a pad that does not exist, and the
    // controls silently never respond.
    const driverGamepad = (numControllers === 1 || gamepad1Role === 'driver') ? 'gamepad1' : 'gamepad2';
    const operatorGamepad = numControllers === 1
      ? 'gamepad1'
      : (gamepad1Role === 'operator' ? 'gamepad1' : 'gamepad2');

    // Helper to convert control name to Java code
    const getAxisCode = (axis, gamepad) => {
      const map = {
        'left_stick_y': `${gamepad}.left_stick_y`,
        'left_stick_x': `${gamepad}.left_stick_x`,
        'right_stick_y': `${gamepad}.right_stick_y`,
        'right_stick_x': `${gamepad}.right_stick_x`
      };
      return map[axis] || `${gamepad}.left_stick_y`;
    };

    const getButtonCode = (button, gamepad) => {
      const map = {
        'a': `${gamepad}.a`,
        'b': `${gamepad}.b`,
        'x': `${gamepad}.x`,
        'y': `${gamepad}.y`,
        'left_bumper': `${gamepad}.left_bumper`,
        'right_bumper': `${gamepad}.right_bumper`,
        'dpad_up': `${gamepad}.dpad_up`,
        'dpad_down': `${gamepad}.dpad_down`,
        'dpad_left': `${gamepad}.dpad_left`,
        'dpad_right': `${gamepad}.dpad_right`,
        'options': `${gamepad}.options`,
        'start': `${gamepad}.start`,
        'left_stick_button': `${gamepad}.left_stick_button`,
        'right_stick_button': `${gamepad}.right_stick_button`,
        'left_trigger': `(${gamepad}.left_trigger > 0.5)`,
        'right_trigger': `(${gamepad}.right_trigger > 0.5)`
      };
      return map[button] || `${gamepad}.a`;
    };

    // Generate motor control code
    // A motor a macro latches on must not also be written every loop, or the
    // control immediately overwrites the latched power.
    const latchedByMacro = (name) => (macros || []).some(m =>
      (m.steps || []).some(st => ['motor_on', 'motor_off'].includes(st.type) && st.motorName === name));

    const generateMotorControlCode = (motorArg) => {
      const motor = { ...motorArg, name: javaVarName(motorArg.name), label: motorArg.name };
      // Keyed by the configured name, not the sanitized Java variable — a motor
      // called "1st intake" becomes m1stIntake and would never match.
      const ctrl = motorControls[motorArg.name] || {
        controller: operatorGamepad,
        control: latchedByMacro(motorArg.name) ? 'none' : 'trigger_pair',
        behavior: 'hold',
        power: 1.0
      };
      const gp = ctrl.controller;
      const power = ctrl.power;

      let code = '';
      if (ctrl.control === 'none') {
        return `        // ${motor.label} is driven by macros only — no direct control,
        // so a latching Turn Motor On is not overwritten each loop.`;
      }
      if (ctrl.behavior === 'toggle') {
        const toggleBtn = ctrl.control === 'single'
          ? (ctrl.singleButton || 'dpad_up')
          : (ctrl.control === 'trigger_pair' ? 'right_bumper' : 'a');
        code = `        // ${motor.name} - Toggle control
        if (${getButtonCode(toggleBtn, gp)} && !${motor.name}ButtonPrev) {
            ${motor.name}Running = !${motor.name}Running;
        }
        ${motor.name}ButtonPrev = ${getButtonCode(toggleBtn, gp)};
        ${motor.name}.setPower(${motor.name}Running ? ${ctrl.singleDirection === 'reverse' ? '-' : ''}${power} : 0);`;
      } else {
        // Hold behavior
        switch (ctrl.control) {
          case 'trigger_pair':
            code = `        // ${motor.name} - Trigger control
        ${motor.name}.setPower((${gp}.right_trigger - ${gp}.left_trigger) * ${power});`;
            break;
          case 'bumper_pair':
            code = `        // ${motor.name} - Bumper control
        if (${gp}.right_bumper) ${motor.name}.setPower(${power});
        else if (${gp}.left_bumper) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;
          case 'dpad_updown':
            code = `        // ${motor.name} - D-Pad Up/Down control
        if (${gp}.dpad_up) ${motor.name}.setPower(${power});
        else if (${gp}.dpad_down) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;
          case 'dpad_leftright':
            code = `        // ${motor.name} - D-Pad Left/Right control
        if (${gp}.dpad_right) ${motor.name}.setPower(${power});
        else if (${gp}.dpad_left) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;
          case 'left_stick_y':
            code = `        // ${motor.name} - Left Stick Y control
        ${motor.name}.setPower(-${gp}.left_stick_y * ${power});`;
            break;
          case 'right_stick_y':
            code = `        // ${motor.name} - Right Stick Y control
        ${motor.name}.setPower(-${gp}.right_stick_y * ${power});`;
            break;
          case 'ab_buttons':
            code = `        // ${motor.name} - A/B button control
        if (${gp}.a) ${motor.name}.setPower(${power});
        else if (${gp}.b) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;
          case 'xy_buttons':
            code = `        // ${motor.name} - X/Y button control
        if (${gp}.y) ${motor.name}.setPower(${power});
        else if (${gp}.x) ${motor.name}.setPower(-${power});
        else ${motor.name}.setPower(0);`;
            break;
          case 'single': {
            const btn = getButtonCode(ctrl.singleButton || 'dpad_up', gp);
            const sign = (ctrl.singleDirection === 'reverse') ? '-' : '';
            code = `        // ${motor.name} - single button, ${ctrl.singleDirection || 'forward'} only
        ${motor.name}.setPower(${btn} ? ${sign}${power} : 0);`;
            break;
          }
          default:
            code = `        // ${motor.name} - Default trigger control
        ${motor.name}.setPower((${gp}.right_trigger - ${gp}.left_trigger) * ${power});`;
        }
      }
      return code;
    };

    // Generate servo control code
    const generateServoControlCode = (servoArg) => {
      const servo = { ...servoArg, name: javaVarName(servoArg.name), label: servoArg.name };
      const ctrl = servoControls[servo.name] || {
        controller: operatorGamepad,
        button: 'a',
        behavior: 'toggle',
        position1: 0.0,
        position2: 1.0
      };
      const gp = ctrl.controller;
      const btn = getButtonCode(ctrl.button, gp);

      if (ctrl.behavior === 'toggle') {
        return `        // ${servo.name} - Toggle control
        if (${btn} && !${servo.name}ButtonPrev) {
            ${servo.name}Open = !${servo.name}Open;
            ${servo.name}.setPosition(${servo.name}Open ? ${ctrl.position2} : ${ctrl.position1});
        }
        ${servo.name}ButtonPrev = ${btn};`;
      } else {
        return `        // ${servo.name} - Hold control
        ${servo.name}.setPosition(${btn} ? ${ctrl.position2} : ${ctrl.position1});`;
      }

    /**
     * Camera-space position of a tag, or null when it is not currently visible.

    private Position seeTag(int tagId) {
        if (limelight == null) return null;
        LLResult result = limelight.getLatestResult();
        if (result == null || !result.isValid()) return null;

    private double tagRangeInches(int tagId) {

    private double tagBearingDegrees(int tagId) {

     */
    private boolean stepTowardTag(int tagId, double targetInches, double offsetInches, double toleranceInches) {

        if (p == null) {

            return false;

        double zIn = p.z * 39.3701;

        double lateralError = xIn - offsetInches;
        double bearingError = Math.toDegrees(Math.atan2(xIn, zIn));

                && Math.abs(bearingError) <= TAG_ANGLE_TOLERANCE) {

                {numControllers === 2 && (
                  <div>
                    <h5 className="text-purple-400 font-semibold mb-2">

                    </h5>
                    <ul className="text-gray-300 space-y-1">
                      {gamepad2Role === 'driver' && (
                        <>
                          <li>• {axisOptions.find(a => a.value === driveForwardBack)?.label}: Forward/Back</li>
                          <li>• {axisOptions.find(a => a.value === driveStrafe)?.label}: Strafe</li>
                          <li>• {axisOptions.find(a => a.value === driveRotate)?.label}: Rotate</li>
                          <li>• {buttonOptions.find(b => b.value === resetHeadingButton)?.label}: Reset Heading</li>

                        <li key={m.id}>• {motorControlOptions.find(o => o.value === getDefaultMotorControl(m.name).control)?.label}: {m.name}</li>
                      ))}

                      ))}
